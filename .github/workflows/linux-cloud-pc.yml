name: Linux Cloud PC (Android GPU)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session length in minutes (max 350)
        required: true
        default: '120'
      vnc_password:
        description: VNC password (min 6 chars)
        required: true
        default: 'cloudpc'
      performance_tweaks:
        description: Apply performance tweaks (Turnip env vars, CPU governor)
        type: boolean
        required: false
        default: true
      auto_continue:
        description: Restart session ~20 min before timeout
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

jobs:
  linux-cloud-pc:
    runs-on: [self-hosted, linux, android]
    timeout-minutes: 355

    env:
      SESSION_MINUTES: ${{ inputs.minutes }}
      VNC_PASSWORD: ${{ inputs.vnc_password }}
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      AUTO_CONTINUE: ${{ inputs.auto_continue }}
      PERF_TWEAKS: ${{ inputs.performance_tweaks }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Record job start time
        run: echo "JOB_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check inputs
        run: |
          set -e
          m=$SESSION_MINUTES
          if ! [[ "$m" =~ ^[0-9]+$ ]] || [ "$m" -lt 1 ] || [ "$m" -gt 350 ]; then
            echo "minutes must be 1-350" && exit 1
          fi
          if [ "${#VNC_PASSWORD}" -lt 6 ]; then
            echo "vnc_password must be at least 6 characters" && exit 1
          fi
          if [ -z "$TS_AUTHKEY" ]; then
            echo "Missing secret TAILSCALE_AUTH_KEY" && exit 1
          fi

      - name: Detect GPU and Vulkan support
        run: |
          echo "=== GPU Info ==="
          if command -v vulkaninfo &>/dev/null; then
            vulkaninfo --summary 2>/dev/null | head -30 || true
          fi
          if ls /vendor/lib64/hw/vulkan.*.so 2>/dev/null || ls /system/lib64/hw/vulkan.*.so 2>/dev/null; then
            echo "NATIVE_VULKAN=1" >> "$GITHUB_ENV"
            echo "Qualcomm Vulkan driver found (Turnip override available)"
          else
            echo "NATIVE_VULKAN=0" >> "$GITHUB_ENV"
            echo "No native Vulkan driver detected in vendor/system"
          fi
          if command -v glxinfo &>/dev/null; then
            glxinfo 2>/dev/null | grep -E "(renderer|version)" | head -5 || true
          fi

      - name: Install runtime packages
        run: |
          pkg update -y 2>/dev/null || apt-get update -y 2>/dev/null || true
          for p in tigervnc xfce4 xfce4-terminal dbus wget curl; do
            pkg install -y "$p" 2>/dev/null || apt-get install -y "$p" 2>/dev/null || true
          done
          command -v box64 &>/dev/null || echo "box64 not found — run scripts/setup-android-runner.sh first"
          command -v wine   &>/dev/null || echo "wine not found — run scripts/setup-android-runner.sh first"

      - name: Performance tweaks (Turnip + CPU governor)
        if: ${{ inputs.performance_tweaks }}
        continue-on-error: true
        run: |
          # Persist GPU env vars into shell profile so VNC session inherits them
          grep -q "CloudMobiR GPU tweaks" ~/.bashrc 2>/dev/null || cat >> ~/.bashrc << 'EOF'
# CloudMobiR GPU tweaks
export MESA_VK_VERSION_OVERRIDE=1.3
export MESA_GL_VERSION_OVERRIDE=4.3
export MESA_GLSL_VERSION_OVERRIDE=430
export VK_ICD_FILENAMES=/data/data/com.termux/files/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
export WINEESYNC=1
export DXVK_ASYNC=1
export DXVK_STATE_CACHE=1
export DXVK_LOG_LEVEL=none
export GALLIUM_DRIVER=freedreno
EOF
          # CPU governor performance mode (needs root on most devices, best-effort)
          for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            echo performance > "$cpu" 2>/dev/null || true
          done
          echo "Tweaks applied"

      - name: Start VNC server (Xfce4)
        run: |
          set -e
          vncserver -kill :1 2>/dev/null || true
          sleep 1
          mkdir -p ~/.vnc
          printf '%s' "$VNC_PASSWORD" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          cat > ~/.vnc/xstartup << 'XEOF'
#!/bin/sh
unset SESSION_MANAGER
unset DBUS_SESSION_BUS_ADDRESS
export MESA_VK_VERSION_OVERRIDE=1.3
export MESA_GL_VERSION_OVERRIDE=4.3
export MESA_GLSL_VERSION_OVERRIDE=430
export VK_ICD_FILENAMES=/data/data/com.termux/files/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
export WINEESYNC=1
export DXVK_ASYNC=1
export DXVK_STATE_CACHE=1
export DXVK_LOG_LEVEL=none
export GALLIUM_DRIVER=freedreno
dbus-launch --exit-with-session startxfce4 &
XEOF
          chmod +x ~/.vnc/xstartup
          vncserver :1 -geometry 1280x720 -depth 24 -rfbauth ~/.vnc/passwd
          sleep 2
          vncserver -list | grep -q ":1" || { echo "VNC failed to start"; exit 1; }
          echo "VNC running on :1  (1280x720)"
          echo "DISPLAY=:1" >> "$GITHUB_ENV"

      - name: Install Tailscale
        run: |
          if ! command -v tailscale &>/dev/null; then
            curl -fsSL https://tailscale.com/install.sh | sh
          fi

      - name: Join tailnet
        run: |
          set -e
          tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="cloudpc-android-$GITHUB_RUN_NUMBER" \
            --netfilter-mode=off \
            --snat-subnet-routes=false \
            --accept-dns=false 2>&1 || \
          tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="cloudpc-android-$GITHUB_RUN_NUMBER" \
            --tun=userspace-networking \
            --accept-dns=false
          for i in $(seq 1 30); do
            ip=$(tailscale ip -4 2>/dev/null || true)
            [ -n "$ip" ] && break
            sleep 2
          done
          [ -z "$ip" ] && echo "No Tailscale IP" && exit 1
          echo "TAILSCALE_IP=$ip" >> "$GITHUB_ENV"
          echo "Tailscale: $ip (cloudpc-android-$GITHUB_RUN_NUMBER)"

      - name: Print connection info
        run: |
          echo "======================================================="
          echo "  Cloud PC (Android / Adreno GPU) READY"
          echo "======================================================="
          echo "  Tailscale : cloudpc-android-$GITHUB_RUN_NUMBER"
          echo "  VNC       : $TAILSCALE_IP:5901"
          echo "  Password  : (your vnc_password input)"
          echo "  GPU       : Adreno (Turnip / Mesa freedreno Vulkan)"
          echo "  Session   : $SESSION_MINUTES min"
          echo "======================================================="
          {
            echo "### Android Cloud PC Ready"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tailscale hostname | \`cloudpc-android-$GITHUB_RUN_NUMBER\` |"
            echo "| Tailscale IP | \`$TAILSCALE_IP\` |"
            echo "| VNC address | \`$TAILSCALE_IP:5901\` |"
            echo "| GPU | Adreno 610 (Turnip Mesa freedreno Vulkan) |"
            echo "| Session | $SESSION_MINUTES minutes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        run: |
          now_s=$(date +%s)
          end=$(( now_s + SESSION_MINUTES * 60 ))
          hard=$(( now_s + 340 * 60 ))
          [ "$end" -gt "$hard" ] && end=$hard
          handover_at=$(( end - 1200 ))
          handed_over=0
          handover_tries=0

          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 60
            vncserver -list 2>/dev/null | grep -q ":1" || \
              vncserver :1 -geometry 1280x720 -depth 24 -rfbauth ~/.vnc/passwd 2>/dev/null || true
            cur=$(date +%s)
            if [ "$handed_over" -eq 0 ] && [ "$AUTO_CONTINUE" = "true" ] && \
               [ "$handover_tries" -lt 5 ] && [ "$cur" -ge "$handover_at" ]; then
              handover_tries=$(( handover_tries + 1 ))
              if gh workflow run linux-cloud-pc.yml --ref main \
                   -f minutes="$SESSION_MINUTES" \
                   -f vnc_password="$VNC_PASSWORD" \
                   -f performance_tweaks="$PERF_TWEAKS" \
                   -f auto_continue=true; then
                handed_over=1
                echo "=== HANDOVER: next run dispatched ==="
              fi
            fi
          done

      - name: Cleanup
        if: always()
        run: |
          vncserver -kill :1 2>/dev/null || true
          tailscale down 2>/dev/null || true
