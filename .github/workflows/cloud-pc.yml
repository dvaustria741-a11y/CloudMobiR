name: Cloud PC

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session length in minutes (hosted runner hard limit is 360 per job)
        required: true
        default: '330'
      username:
        description: Windows account created for RDP
        required: true
        default: cloudpc
      performance_tweaks:
        description: Apply the performance tweaks (High performance power plan, Defender real-time scanning off, lighter visual effects, RDP wallpaper off, process priority for Studio and Blender, idle background services off, Mesa thread cap)
        type: boolean
        required: false
        default: true
      auto_continue:
        description: Keep going past the 6-hour limit - about 20 minutes before this PC ends, save state and start a new PC that restores it (shows in Tailscale as cloudpc-<run number>; cancel all runs to stop)
        type: boolean
        required: false
        default: false
      previous_run:
        description: Internal, set automatically when a run starts its successor. Leave empty.
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-pc-${{ inputs.previous_run || 'manual' }}
  cancel-in-progress: true

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 355
    env:
      RDP_USERNAME: ${{ inputs.username }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      SESSION_MINUTES: ${{ inputs.minutes }}
      AUTO_CONTINUE: ${{ inputs.auto_continue }}
      PERF_TWEAKS: ${{ inputs.performance_tweaks }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATE_PASSWORD: ${{ secrets.STATE_PASSWORD }}
      # Assumption, not verified by me: official Roblox Studio bootstrapper URL.
      STUDIO_INSTALLER_URL: https://setup.rbxcdn.com/RobloxStudioInstaller.exe
      # Verified by me: mmozeiko/build-mesa release 26.3.0 asset lists opengl32.dll (statically linked llvmpipe, software OpenGL). Not run on this runner.
      MESA_LLVMPIPE_URL: https://github.com/mmozeiko/build-mesa/releases/download/26.3.0/mesa-llvmpipe-x64-26.3.0.7z
      # Claude Desktop Windows x64 installer. Both claude.ai URLs below answer with a Cloudflare managed challenge (cf-mitigated: challenge, HTTP 403) to a non-browser client; I confirmed that from my sandbox for both. The step therefore tries each URL in order and checks that the download is a signed PE file. CLAUDE_SETUP_DIRECT_URL (repository variable, optional) is for the final file URL that the redirect leads to, copied from a browser's download list; it is not a Cloudflare-challenged page if it points at the file host.
      CLAUDE_SETUP_URL: https://claude.ai/redirect/claudedotcom.v1.384c5e80-7869-453e-948e-2fb22c0206ae/api/desktop/win32/x64/setup/latest/redirect
      CLAUDE_SETUP_URL_FALLBACK: https://claude.ai/api/desktop/win32/x64/setup/latest/redirect
      # Default: the x64 per-user EXE of version 3.6556.2 on downloads.claude.ai, taken from the winget manifest listing for Anthropic.Claude (wingetly.io/apps/anthropic/claude); it is pinned, so it goes stale when Anthropic ships a newer build. Not fetched by me; the step checks the download is a signed PE file and falls back to the claude.ai redirects and then winget. A secret or variable with this name overrides it.
      CLAUDE_SETUP_DIRECT_URL: ${{ secrets.CLAUDE_SETUP_DIRECT_URL || vars.CLAUDE_SETUP_DIRECT_URL || 'https://downloads.claude.ai/releases/win32/x64/3.6556.2/Claude-20c019a1e61fa5b687616af57d31f97bb3181723.exe' }}
    steps:
      - uses: actions/checkout@v4

      - name: Record job start time
        shell: pwsh
        run: '"JOB_START_UTC=$((Get-Date).ToUniversalTime().ToString(''o''))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Check inputs and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) { throw 'Missing repository secret TAILSCALE_AUTH_KEY.' }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw 'Missing repository secret RDP_PASSWORD.' }
          $m = 0
          if (-not [int]::TryParse($env:SESSION_MINUTES, [ref]$m) -or $m -lt 1 -or $m -gt 350) { throw 'minutes must be a number from 1 to 350.' }
          if ($env:AUTO_CONTINUE -eq 'true' -and $m -lt 60) { throw 'auto_continue needs a session of at least 60 minutes.' }
          if ($env:RDP_USERNAME -notmatch '^[A-Za-z][A-Za-z0-9_]{0,19}$') { throw 'username must be 1-20 letters, digits or underscores, starting with a letter.' }

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $ts -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty -Path "$ts\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1 -Force
          Get-NetFirewallRule -DisplayName 'CloudPC RDP (Tailscale only)' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName 'CloudPC RDP (Tailscale only)' -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Action Allow | Out-Null
          Restart-Service -Name TermService -Force
          if ((Get-Service -Name TermService).Status -ne 'Running') { throw 'TermService is not running.' }

      - name: Create RDP user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $secure
          } else {
            New-LocalUser -Name $env:RDP_USERNAME -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

      - name: Performance tweaks (best effort)
        if: ${{ inputs.performance_tweaks }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Every tweak runs through Invoke-Tweak: an error in one is caught, reported, and the next still runs.
          # None of the tweaks below was run on a runner by me. Each is labelled with how sure I am; the results table in the job summary shows what really applied.
          $results = [System.Collections.Generic.List[string]]::new()
          function Invoke-Tweak {
            param([string]$Name, [scriptblock]$Action)
            $ErrorActionPreference = 'Stop'
            try {
              $note = (& $Action) -join ' '
              Write-Host "[ok]     $Name $note"
              $results.Add("| $Name | applied | $note |")
            } catch {
              $msg = ($_.Exception.Message -replace '\|', '/') -replace '\r?\n', ' '
              Write-Host "[failed] $Name : $msg"
              $results.Add("| $Name | FAILED | $msg |")
            }
          }

          # Verified GUID of the built-in High performance power plan.
          Invoke-Tweak 'High performance power plan' {
            powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
            if ($LASTEXITCODE -ne 0) { throw "powercfg exited with code $LASTEXITCODE" }
          }

          # Assumption, not verified on this runner: real-time scanning can be switched off here (it competes with Studio for CPU). Tamper Protection would block it; the readback catches that.
          Invoke-Tweak 'Defender real-time scanning off' {
            Set-MpPreference -DisableRealtimeMonitoring $true
            if (-not (Get-MpPreference).DisableRealtimeMonitoring) { throw 'Set-MpPreference ran, but real-time monitoring is still on (Tamper Protection?).' }
          }

          # Fairly sure, not verified here: the "Remove remote desktop wallpaper" Group Policy value (TerminalServer.admx, TS_NO_WALLPAPER = fNoRemoteDesktopWallpaper). Read when a session logs on, so it applies to the RDP session you connect with later.
          Invoke-Tweak 'RDP sessions: no desktop wallpaper (policy fNoRemoteDesktopWallpaper)' {
            $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
            Set-ItemProperty -Path $key -Name fNoRemoteDesktopWallpaper -Value 1 -Type DWord -Force
            if ((Get-ItemProperty -Path $key).fNoRemoteDesktopWallpaper -ne 1) { throw 'readback mismatch' }
          }

          # New profiles are copied from the Default user hive, so set "best performance" visual effects there before the RDP user's profile exists.
          # Values are the common Windows performance-tuning ones (VisualFXSetting 2, UserPreferencesMask 9012038010000000, DragFullWindows, MinAnimate); not verified on this runner.
          # Added here, from memory and also unverified: Personalize\EnableTransparency 0 and Explorer\Advanced\TaskbarAnimations 0.
          Invoke-Tweak 'Best-performance visual effects (Default user profile)' {
            $hive = 'C:\Users\Default\NTUSER.DAT'
            $hiveName = 'CloudPcDefault'
            reg load "HKU\$hiveName" $hive | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'could not load the Default user hive' }
            try {
              $writes = @(
                @('Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects', 'VisualFXSetting', 'REG_DWORD', '2'),
                @('Control Panel\Desktop', 'UserPreferencesMask', 'REG_BINARY', '9012038010000000'),
                @('Control Panel\Desktop', 'DragFullWindows', 'REG_SZ', '0'),
                @('Control Panel\Desktop', 'Wallpaper', 'REG_SZ', ''),
                @('Control Panel\Desktop\WindowMetrics', 'MinAnimate', 'REG_SZ', '0'),
                @('Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', 'EnableTransparency', 'REG_DWORD', '0'),
                @('Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', 'TaskbarAnimations', 'REG_DWORD', '0')
              )
              foreach ($w in $writes) {
                reg add "HKU\$hiveName\$($w[0])" /v $w[1] /t $w[2] /d $w[3] /f | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "reg add $($w[1]) failed with code $LASTEXITCODE" }
              }
            } finally {
              [gc]::Collect(); [gc]::WaitForPendingFinalizers()
              for ($i = 0; $i -lt 5; $i++) { reg unload "HKU\$hiveName" 2>$null | Out-Null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 2 }
            }
            if (Test-Path "C:\Users\$env:RDP_USERNAME") { '(the RDP user profile already exists; it keeps its own settings)' }
          }

          # Process priority through Image File Execution Options\<exe>\PerfOptions\CpuPriorityClass (1 idle, 2 normal, 3 high, 5 below normal, 6 above normal). I am fairly sure of this mechanism and of those numbers; not verified on this runner.
          # Studio gets above normal. Blender gets BELOW normal on purpose: a render saturates every core, and at normal or higher priority it competes with the RDP session's own work, so the desktop would stutter during renders; at below normal it still uses all idle CPU.
          # Assumption: the Studio process is RobloxStudioBeta.exe. If the name is wrong the entry is simply never used. blender.exe is the name this workflow already finds.
          Invoke-Tweak 'Process priority: Studio above normal, Blender below normal' {
            $base = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options'
            $priority = [ordered]@{ 'RobloxStudioBeta.exe' = 6; 'blender.exe' = 5 }
            foreach ($exe in $priority.Keys) {
              $k = "$base\$exe\PerfOptions"
              New-Item -Path $k -Force | Out-Null
              Set-ItemProperty -Path $k -Name CpuPriorityClass -Value $priority[$exe] -Type DWord -Force
              if ((Get-ItemProperty -Path $k).CpuPriorityClass -ne $priority[$exe]) { throw "readback mismatch for $exe" }
            }
          }

          # Mesa documents LP_NUM_THREADS for llvmpipe's rasteriser thread count. Leaving one CPU free for the RDP session's own work is my assumption of what keeps the desktop responsive while Blender's viewport renders; not verified, and whether this static opengl32.dll build reads it is also unverified. Machine-level, so the RDP session you connect with later inherits it.
          Invoke-Tweak 'Mesa llvmpipe: leave one CPU free (LP_NUM_THREADS)' {
            $cpus = [int]$env:NUMBER_OF_PROCESSORS
            if ($cpus -lt 2) { return "skipped, only $cpus CPU" }
            [Environment]::SetEnvironmentVariable('LP_NUM_THREADS', [string]($cpus - 1), 'Machine')
            "LP_NUM_THREADS=$($cpus - 1) of $cpus CPUs"
          }

          # Background services nothing here needs. Names are the standard Windows ones; whether each exists, or is already off, on windows-2025 is not verified, and a missing one is reported as a failure of that line only.
          foreach ($svc in 'WSearch', 'SysMain', 'DiagTrack', 'wuauserv', 'UsoSvc') {
            Invoke-Tweak "Service off: $svc" {
              $s = Get-Service -Name $svc -ErrorAction Stop
              if ($s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') { return 'already off' }
              Set-Service -Name $svc -StartupType Disabled
              if ($s.Status -ne 'Stopped') { Stop-Service -Name $svc -Force -ErrorAction Stop; $s.WaitForStatus('Stopped', '00:00:20') }
            }
          }

          $failed = @($results | Where-Object { $_ -like '*| FAILED |*' }).Count
          Write-Host "Performance tweaks finished: $($results.Count - $failed) applied, $failed failed. Failures do not stop the job."
          $summary = "### Performance tweaks`n`n| Tweak | Result | Detail |`n|---|---|---|`n" + ($results -join "`n") + "`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # Native commands above can leave a non-zero exit code behind; the tweaks are best effort, so the step itself must not report it.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Restore saved state
        continue-on-error: true
        shell: pwsh
        run: ./scripts/restore-state.ps1

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'tailscale.msi'
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
          $p = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Tailscale MSI exited with code $($p.ExitCode)." }
          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) { throw 'tailscale.exe not found after install.' }

      - name: Join tailnet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          for ($i = 0; $i -lt 30 -and (Get-Service -Name Tailscale -ErrorAction SilentlyContinue).Status -ne 'Running'; $i++) { Start-Sleep -Seconds 2 }
          if ((Get-Service -Name Tailscale).Status -ne 'Running') { throw 'Tailscale service is not running.' }
          & $ts up --auth-key="$env:TS_AUTHKEY" --hostname="cloudpc-$env:GITHUB_RUN_NUMBER" --unattended --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed with exit code $LASTEXITCODE." }
          $ip = ''
          for ($i = 0; $i -lt 30 -and [string]::IsNullOrWhiteSpace($ip); $i++) {
            $ip = ((& $ts ip -4) | Select-Object -First 1)
            if ([string]::IsNullOrWhiteSpace($ip)) { Start-Sleep -Seconds 2 }
          }
          if ([string]::IsNullOrWhiteSpace($ip)) { throw 'No Tailscale IPv4 address was assigned.' }
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP is reachable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $r.TcpTestSucceeded) { throw "TCP 3389 on $env:TAILSCALE_IP is not reachable." }
          Write-Host "RDP ready on $env:TAILSCALE_IP (Tailscale name: cloudpc-$env:GITHUB_RUN_NUMBER, user: $env:RDP_USERNAME, password: your RDP_PASSWORD secret)"
          "### Cloud PC ready`n`nTailscale name: ``cloudpc-$env:GITHUB_RUN_NUMBER``  IP: ``$env:TAILSCALE_IP``  user: ``$env:RDP_USERNAME``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Download Roblox Studio installer to the desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\Users\Public\Desktop\RobloxStudioInstaller.exe'
          Invoke-WebRequest -Uri $env:STUDIO_INSTALLER_URL -OutFile $dest
          $f = Get-Item $dest
          $head = [System.IO.File]::ReadAllBytes($dest)[0..1]
          if ($f.Length -lt 100KB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) { Remove-Item $dest -Force; throw "Downloaded file is not a valid Windows executable ($($f.Length) bytes)." }
          Write-Host "Installer saved to $dest ($($f.Length) bytes)"

      - name: Install Roblox Player
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $baseUrl = 'https://setup.rbxcdn.com'

          # 1. Latest WindowsPlayer version. Assumption, not verified by me: clientsettings returns JSON with clientVersionUpload, and setup.rbxcdn.com/version returns the same string as plain text.
          $version = $null
          try { $version = (Invoke-RestMethod -Uri 'https://clientsettings.roblox.com/v2/client-version/WindowsPlayer').clientVersionUpload } catch { Write-Host "clientsettings failed: $($_.Exception.Message)" }
          if (-not $version -or $version -notmatch '^version-[0-9a-f]+$') {
            try { $version = ((Invoke-WebRequest -Uri "$baseUrl/version").Content).Trim() } catch { Write-Host "setup.rbxcdn.com/version failed: $($_.Exception.Message)" }
          }
          if (-not $version -or $version -notmatch '^version-[0-9a-f]+$') { throw "Could not determine the WindowsPlayer version (got '$version')." }
          Write-Host "WindowsPlayer version: $version"

          # 2. A folder every account on this PC can read, so the RDP user can run it (this step runs as the runner account, whose LOCALAPPDATA the RDP user cannot see).
          $installDir = "C:\Users\Public\Roblox\Versions\$version"
          $tempDir = Join-Path $env:TEMP "RobloxDirect_$version"
          New-Item -ItemType Directory -Force -Path $installDir, $tempDir | Out-Null

          # 3. Package manifest: a "v0" line, then per package its name, MD5, compressed size and uncompressed size.
          $manifest = ((Invoke-WebRequest -Uri "$baseUrl/$version-rbxPkgManifest.txt").Content -split "`r?`n") | ForEach-Object { $_.Trim() }

          $extractMap = @{
            'RobloxApp.zip'                     = ''
            'shaders.zip'                       = 'shaders'
            'ssl.zip'                           = 'ssl'
            'WebView2.zip'                      = ''
            'WebView2RuntimeInstaller.zip'      = 'WebView2RuntimeInstaller'
            'content-avatar.zip'                = 'content\avatar'
            'content-configs.zip'               = 'content\configs'
            'content-fonts.zip'                 = 'content\fonts'
            'content-sky.zip'                   = 'content\sky'
            'content-sounds.zip'                = 'content\sounds'
            'content-textures2.zip'             = 'content\textures'
            'content-models.zip'                = 'content\models'
            'content-platform-fonts.zip'        = 'PlatformContent\pc\fonts'
            'content-platform-dictionaries.zip' = 'PlatformContent\pc\shared_compression_dictionaries'
            'content-terrain.zip'               = 'PlatformContent\pc\terrain'
            'content-textures3.zip'             = 'PlatformContent\pc\textures'
            'extracontent-places.zip'           = 'ExtraContent\places'
            'extracontent-luapackages.zip'      = 'ExtraContent\LuaPackages'
            'extracontent-translations.zip'     = 'ExtraContent\translations'
            'extracontent-models.zip'           = 'ExtraContent\models'
            'extracontent-textures.zip'         = 'ExtraContent\textures'
          }

          # 4. Download, check the MD5 when the manifest gives one, and extract each package.
          $installed = 0
          for ($i = 0; $i -lt $manifest.Count; $i++) {
            $pkg = $manifest[$i]
            if ($pkg -notlike '*.zip') { continue }
            if (-not $extractMap.ContainsKey($pkg)) { Write-Host "Not in the extract map, skipped: $pkg"; continue }
            $zipPath = Join-Path $tempDir $pkg
            $sub = $extractMap[$pkg]
            $targetPath = if ($sub -eq '') { $installDir } else { Join-Path $installDir $sub }
            New-Item -ItemType Directory -Force -Path $targetPath | Out-Null
            Invoke-WebRequest -Uri "$baseUrl/$version-$pkg" -OutFile $zipPath
            $expected = if ($i + 1 -lt $manifest.Count) { $manifest[$i + 1] } else { '' }
            if ($expected -match '^[0-9a-fA-F]{32}$') {
              $actual = (Get-FileHash -Algorithm MD5 -Path $zipPath).Hash
              if ($actual -ne $expected.ToUpper()) { throw "MD5 mismatch for ${pkg}: expected $expected, got $actual" }
            } else {
              Write-Host "No MD5 line after $pkg in the manifest; not verified."
            }
            Expand-Archive -Path $zipPath -DestinationPath $targetPath -Force
            $installed++
            Write-Host "Extracted $pkg -> $targetPath"
          }
          if ($installed -eq 0) { throw 'No packages were installed; the manifest had none of the expected .zip names.' }

          # 5. AppSettings.xml next to the player.
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Settings>
          	<ContentFolder>content</ContentFolder>
          	<BaseUrl>http://roblox.com</BaseUrl>
          </Settings>
          "@ | Set-Content -Path (Join-Path $installDir 'AppSettings.xml') -Encoding UTF8

          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue

          # 6. Desktop shortcut for every user.
          $playerExe = Join-Path $installDir 'RobloxPlayerBeta.exe'
          if (-not (Test-Path $playerExe)) { throw "RobloxPlayerBeta.exe is missing from $installDir after extraction." }
          $lnk = 'C:\Users\Public\Desktop\Roblox Player.lnk'
          $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          $sh.TargetPath = $playerExe
          $sh.WorkingDirectory = $installDir
          $sh.Save()
          Write-Host "Installed Roblox Player at $playerExe ($installed packages)"

      - name: Add Roblox Diagnose shortcut to the desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'C:\Users\Public\roblox-diagnose.ps1'
          $body = @'
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:USERPROFILE 'Desktop\roblox-diagnose.txt'
          $lines = New-Object System.Collections.Generic.List[string]
          function Add-Section($t) { $lines.Add(''); $lines.Add("=== $t ===") }
          Add-Section 'System'
          $os = Get-CimInstance Win32_OperatingSystem
          $lines.Add("$($os.Caption) build $($os.BuildNumber)")
          Get-CimInstance Win32_VideoController | ForEach-Object { $lines.Add("GPU: $($_.Name) | driver $($_.DriverVersion) | status $($_.Status)") }
          $bcd = (bcdedit /enum '{current}' 2>&1 | Select-String 'testsigning') -join ' '
          $lines.Add("bcdedit testsigning: $bcd")
          Add-Section 'Player start test'
          $root = @((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'), 'C:\Users\Public\Roblox\Versions')
          $player = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName 'RobloxPlayerBeta.exe') } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $player) {
            $lines.Add("No RobloxPlayerBeta.exe found under $root")
          } else {
            $lines.Add($player.FullName)
            $p = Start-Process (Join-Path $player.FullName 'RobloxPlayerBeta.exe') -PassThru
            Start-Sleep -Seconds 10
            if ($p.HasExited) { $lines.Add("Player exited after under 10 s, exit code $($p.ExitCode)") } else { $lines.Add('Player process still running after 10 s (left running)') }
          }
          Add-Section 'Application errors, last 20 minutes'
          $ev = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-20) } -MaxEvents 6 -ErrorAction SilentlyContinue
          if (-not $ev) { $lines.Add('none') }
          foreach ($e in $ev) { $lines.Add("$($e.TimeCreated) $($e.ProviderName): " + ((($e.Message -split "`n") | Select-Object -First 4) -join ' ')) }
          Add-Section 'Newest Roblox logs'
          $logs = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox\logs') -Recurse -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 6
          foreach ($l in $logs) { $lines.Add("$($l.LastWriteTime) $($l.Length) $($l.Name)") }
          $pl = $logs | Where-Object { $_.Name -like '*Player*' } | Select-Object -First 1
          if ($pl) {
            Add-Section "Last 40 lines of $($pl.Name)"
            Get-Content $pl.FullName -Tail 40 | ForEach-Object { $lines.Add($_) }
          } else {
            Add-Section 'No Player log exists in the newest 6 files'
          }
          Set-Content -Path $out -Value $lines -Encoding utf8
          Start-Process notepad.exe $out
          '@
          Set-Content -Path $script -Value $body -Encoding utf8
          $lnk = 'C:\Users\Public\Desktop\Roblox Diagnose.lnk'
          $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          $sh.TargetPath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $sh.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$script`""
          $sh.Save()
          if (-not (Test-Path $lnk)) { throw 'Shortcut was not created.' }

      - name: Add Claude Desktop download shortcut to the desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'C:\Users\Public\Desktop\Download Claude Desktop.url'
          Set-Content -Path $path -Value "[InternetShortcut]`r`nURL=https://claude.com/download" -Encoding ascii
          if (-not (Test-Path $path)) { throw 'Shortcut was not created.' }

      - name: Install Blender
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Assumption, not verified by me: Chocolatey (preinstalled on GitHub Windows runners) has a 'blender' package.
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) { throw 'choco is not available on this runner.' }
          choco install blender -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install blender exited with code $LASTEXITCODE." }
          $exe = Get-ChildItem -Path "$env:ProgramFiles\Blender Foundation" -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'blender.exe not found after install.' }
          $lnk = 'C:\Users\Public\Desktop\Blender.lnk'
          if (-not (Test-Path $lnk)) {
            $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
            $sh.TargetPath = $exe.FullName
            $sh.WorkingDirectory = $exe.DirectoryName
            $sh.Save()
          }
          Write-Host "Blender installed: $($exe.FullName)"

      - name: Enable software OpenGL (Mesa llvmpipe) for Blender
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $exe = Get-ChildItem -Path "$env:ProgramFiles\Blender Foundation" -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'blender.exe not found; the Install Blender step did not succeed.' }
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and (Test-Path "$env:ProgramFiles\7-Zip\7z.exe")) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not $sevenZip) { throw '7z is not available on this runner.' }
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe.7z'
          $out = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe'
          Invoke-WebRequest -Uri $env:MESA_LLVMPIPE_URL -OutFile $archive -UseBasicParsing
          if ((Get-Item $archive).Length -lt 1MB) { throw 'Mesa archive is unexpectedly small.' }
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          & $sevenZip x $archive "-o$out" opengl32.dll -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE." }
          $dll = Join-Path $out 'opengl32.dll'
          $head = [System.IO.File]::ReadAllBytes($dll)[0..1]
          if (-not (Test-Path $dll) -or (Get-Item $dll).Length -lt 1MB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw 'Extracted opengl32.dll is missing or not a valid DLL.' }
          # Blender loads opengl32.dll from its own folder first, so this overrides the runner's GPU-less system OpenGL.
          Copy-Item -Path $dll -Destination (Join-Path $exe.DirectoryName 'opengl32.dll') -Force
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Mesa llvmpipe opengl32.dll installed next to $($exe.FullName)"

      - name: Install Claude Desktop
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $setup = Join-Path $env:TEMP 'Claude-Setup.exe'
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          # The direct file URL first (no challenge page in front of it), then the two claude.ai redirects.
          $urls = @($env:CLAUDE_SETUP_DIRECT_URL, $env:CLAUDE_SETUP_URL, $env:CLAUDE_SETUP_URL_FALLBACK) | Where-Object { $_ -and $_.Trim() }
          $ok = $false
          foreach ($u in $urls) {
            Remove-Item $setup -Force -ErrorAction SilentlyContinue
            try {
              $resp = Invoke-WebRequest -Uri $u -OutFile $setup -UserAgent $ua -MaximumRedirection 10 -UseBasicParsing -PassThru
              Write-Host "Fetched $u -> $($resp.BaseResponse.ResponseUri)  Content-Type: $($resp.Headers['Content-Type'])"
            } catch {
              $status = ''
              $mitigated = ''
              if ($_.Exception.Response) {
                $status = [int]$_.Exception.Response.StatusCode
                $mitigated = $_.Exception.Response.Headers['cf-mitigated']
              }
              Write-Host "Skipped $u : HTTP '$status' cf-mitigated '$mitigated'. A Cloudflare challenge cannot be passed from this runner."
              continue
            }
            if (-not (Test-Path $setup)) { Write-Host "No file written for $u"; continue }
            $f = Get-Item $setup
            $head = [System.IO.File]::ReadAllBytes($setup)[0..1]
            if ($f.Length -lt 1MB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
              Write-Host "Skipped $u : the download is not a Windows executable ($($f.Length) bytes)."
              continue
            }
            $sig = Get-AuthenticodeSignature $setup
            Write-Host "Signature: $($sig.Status), signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Host "Skipped $u : no valid Authenticode signature."; continue }
            $ok = $true
            break
          }
          if ($ok) {
            # Always leave the real installer on the desktop, so the RDP user can run it as themselves if the silent run below does nothing.
            Copy-Item $setup 'C:\Users\Public\Desktop\Claude Setup.exe' -Force
            # The installer's silent switch is not verified by me; the run is bounded and its exit code logged, never fatal.
            $p = Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru
            if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; Write-Host 'Silent install did not finish in 5 minutes and was stopped. Run "Claude Setup" from the desktop.' }
            else { Write-Host "Installer exited with code $($p.ExitCode). If Claude is missing after sign-in, run 'Claude Setup' from the desktop." }
            Remove-Item $setup -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host 'No Claude installer URL worked. Trying winget (package id Anthropic.Claude, from the winget manifest listing; not verified on this runner).'
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              & winget install --id Anthropic.Claude --exact --silent --accept-package-agreements --accept-source-agreements
              Write-Host "winget exited with code $LASTEXITCODE"
              if ($LASTEXITCODE -ne 0) { throw 'Claude Desktop winget install failed.' }
            } else {
              Write-Host 'winget is not available on this runner. Use the "Download Claude Desktop" shortcut on the desktop, or set CLAUDE_SETUP_DIRECT_URL to a newer file URL.'
              throw 'Claude Desktop download failed.'
            }
          }

      - name: Set Claude Desktop MCP config (Roblox Studio)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The whole claude_desktop_config.json is replaced with this, as requested. Claude Desktop's own keys in that file are dropped.
          $body = @'
          {
            "mcpServers": {
              "Roblox_Studio": {
                "command": "cmd.exe",
                "args": [
                  "/c",
                  "cd /d %LOCALAPPDATA%\\Roblox && .\\mcp.bat"
                ]
              }
            }
          }
          '@
          $null = $body | ConvertFrom-Json   # throws if the JSON is malformed

          # The RDP user's profile may not exist yet (Windows creates it at first sign-in, and a folder made beforehand can end up as a duplicate profile), so the file is kept in a shared folder and copied into %APPDATA%\Claude at every sign-in by an all-users Startup script.
          $shared = 'C:\ProgramData\CloudMobiR'
          New-Item -ItemType Directory -Force -Path $shared | Out-Null
          Set-Content -Path (Join-Path $shared 'claude_desktop_config.json') -Value $body -Encoding utf8

          $startup = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
          $cmd = "@echo off`r`nif not exist `"%APPDATA%\Claude`" mkdir `"%APPDATA%\Claude`"`r`ncopy /Y `"$shared\claude_desktop_config.json`" `"%APPDATA%\Claude\claude_desktop_config.json`" >nul`r`n"
          Set-Content -Path (Join-Path $startup 'claude-mcp-config.cmd') -Value $cmd -Encoding ascii

          # If the profile is already there (restored state), apply it now as well.
          $dir = "C:\Users\$env:RDP_USERNAME\AppData\Roaming\Claude"
          if (Test-Path $dir) {
            Copy-Item (Join-Path $shared 'claude_desktop_config.json') (Join-Path $dir 'claude_desktop_config.json') -Force
            Write-Host "Replaced $dir\claude_desktop_config.json"
          } else {
            Write-Host 'Profile not created yet; the config is applied at the first sign-in.'
          }

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      - name: Install FreeLLMAPI and the Claude Code launcher
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # Source: tashfeenahmed/freellmapi README and docs/en/install/01-install.md, read by me. Not run on a runner by me.
          # Docker is not used: the Windows runner runs Windows containers, so the Linux image would not start. The documented "production build without Docker" path is used instead (npm ci, npm run build, node server/dist/index.js).
          # Cloned from the default branch, not pinned, so it follows upstream.
          $shared = 'C:\ProgramData\CloudMobiR'
          $nodeHome = Join-Path $shared 'node'
          $appDir = Join-Path $shared 'freellmapi'
          $npmGlobal = Join-Path $shared 'npm-global'
          $runCmd = Join-Path $shared 'freellmapi-run.cmd'
          $logFile = Join-Path $shared 'freellmapi.log'
          $port = 3001
          $url = "http://127.0.0.1:$port"
          New-Item -ItemType Directory -Force -Path $shared, $npmGlobal | Out-Null

          # Copy the Node that setup-node installed into a shared folder: the RDP user cannot rely on the runner account's tool cache.
          $nodeSource = Split-Path (Get-Command node -ErrorAction Stop).Source
          if (Test-Path $nodeHome) { Remove-Item $nodeHome -Recurse -Force }
          Copy-Item $nodeSource $nodeHome -Recurse -Force
          $nodeExe = Join-Path $nodeHome 'node.exe'
          if (-not (Test-Path $nodeExe)) { throw "node.exe missing from $nodeHome" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $parts = @($machinePath -split ';' | Where-Object { $_ })
          foreach ($dir in @($nodeHome, $npmGlobal)) { if ($parts -notcontains $dir) { $parts += $dir } }
          [Environment]::SetEnvironmentVariable('Path', ($parts -join ';'), 'Machine')
          $env:Path = "$nodeHome;$npmGlobal;$env:Path"
          Write-Host "Node: $(& $nodeExe --version)"

          if (Test-Path $appDir) { Remove-Item $appDir -Recurse -Force }
          git clone --depth 1 https://github.com/tashfeenahmed/freellmapi.git $appDir
          if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }
          Push-Location $appDir
          try {
            & "$nodeHome\npm.cmd" ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }
            & "$nodeHome\npm.cmd" run build
            if ($LASTEXITCODE -ne 0) { throw "npm run build failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          if (-not (Test-Path (Join-Path $appDir 'server\dist\index.js'))) { throw 'server\dist\index.js is missing after the build.' }

          # Encryption key for the stored provider keys, generated per run. The database lives in the repo folder on this runner, so it is wiped when the run ends (it is not part of the saved state).
          $bytes = New-Object byte[] 32
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $encKey = -join ($bytes | ForEach-Object { '{0:x2}' -f $_ })
          $runBody = @"
          @echo off
          set NODE_ENV=production
          set PORT=$port
          set HOST=127.0.0.1
          set ENCRYPTION_KEY=$encKey
          cd /d $appDir
          "$nodeExe" server\dist\index.js >> "$logFile" 2>&1
          "@
          Set-Content -Path $runCmd -Value $runBody -Encoding ascii

          # A scheduled task running as SYSTEM, so the server outlives this step and the RDP sign-in.
          Get-ScheduledTask -TaskName 'FreeLLMAPI' -ErrorAction SilentlyContinue | Unregister-ScheduledTask -Confirm:$false
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c $runCmd"
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit ([TimeSpan]::Zero) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          Register-ScheduledTask -TaskName 'FreeLLMAPI' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName 'FreeLLMAPI'

          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { $null = Invoke-WebRequest -Uri "$url/" -UseBasicParsing -TimeoutSec 3; $up = $true }
            catch { if ($_.Exception.Response) { $up = $true } else { Start-Sleep -Seconds 2 } }
          }
          if (-not $up) {
            if (Test-Path $logFile) { Get-Content $logFile -Tail 40 | ForEach-Object { Write-Host $_ } }
            throw "FreeLLMAPI did not answer on $url within 2 minutes."
          }
          Write-Host "FreeLLMAPI answers on $url"

          $desktop = 'C:\Users\Public\Desktop'
          Set-Content -Path (Join-Path $desktop 'FreeLLMAPI Dashboard.url') -Value "[InternetShortcut]`r`nURL=$url" -Encoding ascii

          # Claude Code, installed into a shared prefix so the RDP user finds it on PATH. Package name @anthropic-ai/claude-code is from memory, not verified on this runner.
          & "$nodeHome\npm.cmd" install -g '@anthropic-ai/claude-code' --prefix $npmGlobal
          if ($LASTEXITCODE -ne 0) { Write-Host "Claude Code install failed with exit code $LASTEXITCODE; the launcher below still works if you install it later." }

          # The unified key only exists after the first dashboard sign-up, so the launcher asks for it (paste it; typing over RDP gets scrambled).
          # `freellmapi launch` and FREELLMAPI_URL / FREELLMAPI_API_KEY are from docs/en/cli/01-generators.md and cli/src/index.ts, read by me.
          $launcher = @"
          @echo off
          set /p FREELLMAPI_API_KEY=Paste the unified API key from the FreeLLMAPI Keys page and press Enter: 
          set FREELLMAPI_URL=$url
          npx -y freellmapi launch
          pause
          "@
          Set-Content -Path (Join-Path $desktop 'Claude Code via FreeLLMAPI.cmd') -Value $launcher -Encoding ascii

          "### FreeLLMAPI`n`nDashboard on the cloud PC: ``$url`` (shortcut on the desktop). Create the first account there, add provider keys on the Keys page, copy the unified key, then use ``Claude Code via FreeLLMAPI`` on the desktop. Server log: ``$logFile``.`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Keep session alive
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes([int]$env:SESSION_MINUTES)
          # Leave about 15 minutes before the 355-minute job timeout (6 h runner limit) for the final save and handover.
          $hardEnd = ([datetime]::Parse($env:JOB_START_UTC, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)).ToLocalTime().AddMinutes(340)
          if ($end -gt $hardEnd) { $end = $hardEnd; Write-Host 'Session length was shortened so the final save fits inside the runner time limit.' }
          Write-Host "Session ends at $($end.ToUniversalTime().ToString('u'))"
          $handoverAt = $end.AddMinutes(-20)
          $handedOver = $false
          $handoverTries = 0
          $nextSave = (Get-Date).AddMinutes(30)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            if ((Get-Service -Name TermService).Status -ne 'Running') { throw 'TermService stopped.' }
            if (-not $handedOver -and $env:AUTO_CONTINUE -eq 'true' -and $handoverTries -lt 5 -and (Get-Date) -ge $handoverAt) {
              $handoverTries++
              # Save first, so the new PC restores the newest state, then start the next run while this PC stays usable.
              $marker = Join-Path $env:RUNNER_TEMP 'last-save-ok.txt'
              Remove-Item $marker -Force -ErrorAction SilentlyContinue
              try { & "$env:GITHUB_WORKSPACE\scripts\save-state.ps1" } catch { Write-Host "Handover save failed: $_" }
              if (Test-Path $marker) {
                gh workflow run cloud-pc.yml --ref main -f minutes=$env:SESSION_MINUTES -f username=$env:RDP_USERNAME -f performance_tweaks=$env:PERF_TWEAKS -f auto_continue=true -f previous_run=$env:GITHUB_RUN_ID
                if ($LASTEXITCODE -eq 0) {
                  $handedOver = $true
                  'HANDED_OVER=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  Write-Host '=== HANDOVER: the next Cloud PC run was started. In about 10-15 minutes a new device named cloudpc-<run number> appears in Tailscale. Save your work in Studio, then move to the new PC. Changes made on this PC after this point are NOT saved. ==='
                } else { Write-Host "Could not start the next run (exit code $LASTEXITCODE); try $handoverTries of 5." }
              } else { Write-Host "Handover save did not succeed (is STATE_PASSWORD set?); try $handoverTries of 5." }
            }
            elseif (-not $handedOver -and (Get-Date) -ge $nextSave) {
              try { & "$env:GITHUB_WORKSPACE\scripts\save-state.ps1" } catch { Write-Host "Autosave failed: $_" }
              $nextSave = (Get-Date).AddMinutes(30)
            }
          }

      - name: Save state
        if: ${{ always() && env.HANDED_OVER != '1' }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/save-state.ps1

