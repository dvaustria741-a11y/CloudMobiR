name: Cloud PC

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session length in minutes (hosted runner hard limit is 360 per job)
        required: true
        default: '330'
      username:
        description: Windows account created for RDP
        required: true
        default: cloudpc
      disable_test_mode:
        description: Experiment - turn off Windows Test Mode and restart the runner after setup (the session may not survive the restart)
        type: boolean
        required: false
        default: false
      auto_continue:
        description: When the session ends, save state and start a fresh Cloud PC run that restores it (keeps going until you cancel; the Tailscale IP may change)
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-pc
  cancel-in-progress: true

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 355
    env:
      RDP_USERNAME: ${{ inputs.username }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      SESSION_MINUTES: ${{ inputs.minutes }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATE_PASSWORD: ${{ secrets.STATE_PASSWORD }}
      # Assumption, not verified by me: official Roblox Studio bootstrapper URL.
      STUDIO_INSTALLER_URL: https://setup.rbxcdn.com/RobloxStudioInstaller.exe
      # Assumption, not verified by me (not reachable from my sandbox): Roblox Player installer redirect.
      ROBLOX_PLAYER_URL: https://www.roblox.com/download/client
      # Verified by me: mmozeiko/build-mesa release 26.3.0 asset lists opengl32.dll (statically linked llvmpipe, software OpenGL). Not run on this runner.
      MESA_LLVMPIPE_URL: https://github.com/mmozeiko/build-mesa/releases/download/26.3.0/mesa-llvmpipe-x64-26.3.0.7z
      # Official x64 Claude Desktop MSIX, redirect URL from Anthropic's Intune deployment README (found by web search, not tested by me on this runner). Empty would mean not set.
      CLAUDE_MSIX_URL: https://claude.ai/api/desktop/win32/x64/msix/latest/redirect
    steps:
      - uses: actions/checkout@v4

      - name: Record job start time
        shell: pwsh
        run: '"JOB_START_UTC=$((Get-Date).ToUniversalTime().ToString(''o''))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Check inputs and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) { throw 'Missing repository secret TAILSCALE_AUTH_KEY.' }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw 'Missing repository secret RDP_PASSWORD.' }
          $m = 0
          if (-not [int]::TryParse($env:SESSION_MINUTES, [ref]$m) -or $m -lt 1 -or $m -gt 350) { throw 'minutes must be a number from 1 to 350.' }
          if ($env:RDP_USERNAME -notmatch '^[A-Za-z][A-Za-z0-9_]{0,19}$') { throw 'username must be 1-20 letters, digits or underscores, starting with a letter.' }

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $ts -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty -Path "$ts\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1 -Force
          Get-NetFirewallRule -DisplayName 'CloudPC RDP (Tailscale only)' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName 'CloudPC RDP (Tailscale only)' -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Action Allow | Out-Null
          Restart-Service -Name TermService -Force
          if ((Get-Service -Name TermService).Status -ne 'Running') { throw 'TermService is not running.' }

      - name: Create RDP user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $secure
          } else {
            New-LocalUser -Name $env:RDP_USERNAME -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

      - name: Performance tweaks (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Verified GUID of the built-in High performance power plan.
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          # Assumption, not verified on this runner: real-time scanning can be switched off here (it competes with Studio for CPU).
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Host "Defender real-time scanning not changed: $_" }
          # New profiles are copied from the Default user hive, so set "best performance" visual effects there before the RDP user's profile exists.
          # Values are the common Windows performance-tuning ones (VisualFXSetting 2, UserPreferencesMask 9012038010000000); not verified on this runner.
          $hive = 'C:\Users\Default\NTUSER.DAT'
          $name = 'CloudPcDefault'
          if (Test-Path "C:\Users\$env:RDP_USERNAME") { Write-Host 'Profile already exists; Default-user visual effects are not applied to it.' }
          reg load "HKU\$name" $hive | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host 'Could not load the Default user hive; skipping visual effect tweaks.'; return }
          reg add "HKU\$name\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f | Out-Null
          reg add "HKU\$name\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f | Out-Null
          reg add "HKU\$name\Control Panel\Desktop" /v DragFullWindows /t REG_SZ /d 0 /f | Out-Null
          reg add "HKU\$name\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "" /f | Out-Null
          reg add "HKU\$name\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f | Out-Null
          [gc]::Collect(); [gc]::WaitForPendingFinalizers()
          for ($i = 0; $i -lt 5; $i++) { reg unload "HKU\$name" 2>$null | Out-Null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 2 }
          Write-Host 'Performance tweaks applied.'

      - name: Restore saved state
        continue-on-error: true
        shell: pwsh
        run: ./scripts/restore-state.ps1

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'tailscale.msi'
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
          $p = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Tailscale MSI exited with code $($p.ExitCode)." }
          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) { throw 'tailscale.exe not found after install.' }

      - name: Join tailnet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          for ($i = 0; $i -lt 30 -and (Get-Service -Name Tailscale -ErrorAction SilentlyContinue).Status -ne 'Running'; $i++) { Start-Sleep -Seconds 2 }
          if ((Get-Service -Name Tailscale).Status -ne 'Running') { throw 'Tailscale service is not running.' }
          & $ts up --auth-key="$env:TS_AUTHKEY" --hostname=cloudpc --unattended --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed with exit code $LASTEXITCODE." }
          $ip = ''
          for ($i = 0; $i -lt 30 -and [string]::IsNullOrWhiteSpace($ip); $i++) {
            $ip = ((& $ts ip -4) | Select-Object -First 1)
            if ([string]::IsNullOrWhiteSpace($ip)) { Start-Sleep -Seconds 2 }
          }
          if ([string]::IsNullOrWhiteSpace($ip)) { throw 'No Tailscale IPv4 address was assigned.' }
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP is reachable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $r.TcpTestSucceeded) { throw "TCP 3389 on $env:TAILSCALE_IP is not reachable." }
          Write-Host "RDP ready on $env:TAILSCALE_IP (user: $env:RDP_USERNAME, password: your RDP_PASSWORD secret)"

      - name: Download Roblox Studio installer to the desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\Users\Public\Desktop\RobloxStudioInstaller.exe'
          Invoke-WebRequest -Uri $env:STUDIO_INSTALLER_URL -OutFile $dest
          $f = Get-Item $dest
          $head = [System.IO.File]::ReadAllBytes($dest)[0..1]
          if ($f.Length -lt 100KB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) { Remove-Item $dest -Force; throw "Downloaded file is not a valid Windows executable ($($f.Length) bytes)." }
          Write-Host "Installer saved to $dest ($($f.Length) bytes)"

      - name: Install Roblox Player
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dest = 'C:\Users\Public\Desktop\RobloxPlayerInstaller.exe'
          Invoke-WebRequest -Uri $env:ROBLOX_PLAYER_URL -OutFile $dest -UseBasicParsing
          $f = Get-Item $dest
          $head = [System.IO.File]::ReadAllBytes($dest)[0..1]
          if ($f.Length -lt 100KB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) { Remove-Item $dest -Force; throw "Downloaded file is not a valid Windows executable ($($f.Length) bytes). Check ROBLOX_PLAYER_URL." }
          # Assumption, not verified by me: the Roblox bootstrapper accepts -silent. The installer stays on the desktop either way.
          $p = Start-Process -FilePath $dest -ArgumentList '-silent' -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Write-Host 'Silent install timed out; run RobloxPlayerInstaller.exe from the desktop.' }
          elseif ($p.ExitCode -ne 0) { Write-Host "Roblox installer exited with code $($p.ExitCode); run RobloxPlayerInstaller.exe from the desktop if Roblox Player is missing." }
          else { Write-Host 'Roblox Player installer finished.' }

      - name: Add Roblox Diagnose shortcut to the desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'C:\Users\Public\roblox-diagnose.ps1'
          $body = @'
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:USERPROFILE 'Desktop\roblox-diagnose.txt'
          $lines = New-Object System.Collections.Generic.List[string]
          function Add-Section($t) { $lines.Add(''); $lines.Add("=== $t ===") }
          Add-Section 'System'
          $os = Get-CimInstance Win32_OperatingSystem
          $lines.Add("$($os.Caption) build $($os.BuildNumber)")
          Get-CimInstance Win32_VideoController | ForEach-Object { $lines.Add("GPU: $($_.Name) | driver $($_.DriverVersion) | status $($_.Status)") }
          $bcd = (bcdedit /enum '{current}' 2>&1 | Select-String 'testsigning') -join ' '
          $lines.Add("bcdedit testsigning: $bcd")
          Add-Section 'Player start test'
          $root = Join-Path $env:LOCALAPPDATA 'Roblox\Versions'
          $player = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName 'RobloxPlayerBeta.exe') } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $player) {
            $lines.Add("No RobloxPlayerBeta.exe found under $root")
          } else {
            $lines.Add($player.FullName)
            $p = Start-Process (Join-Path $player.FullName 'RobloxPlayerBeta.exe') -PassThru
            Start-Sleep -Seconds 10
            if ($p.HasExited) { $lines.Add("Player exited after under 10 s, exit code $($p.ExitCode)") } else { $lines.Add('Player process still running after 10 s (left running)') }
          }
          Add-Section 'Application errors, last 20 minutes'
          $ev = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-20) } -MaxEvents 6 -ErrorAction SilentlyContinue
          if (-not $ev) { $lines.Add('none') }
          foreach ($e in $ev) { $lines.Add("$($e.TimeCreated) $($e.ProviderName): " + ((($e.Message -split "`n") | Select-Object -First 4) -join ' ')) }
          Add-Section 'Newest Roblox logs'
          $logs = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox\logs') -Recurse -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 6
          foreach ($l in $logs) { $lines.Add("$($l.LastWriteTime) $($l.Length) $($l.Name)") }
          $pl = $logs | Where-Object { $_.Name -like '*Player*' } | Select-Object -First 1
          if ($pl) {
            Add-Section "Last 40 lines of $($pl.Name)"
            Get-Content $pl.FullName -Tail 40 | ForEach-Object { $lines.Add($_) }
          } else {
            Add-Section 'No Player log exists in the newest 6 files'
          }
          Set-Content -Path $out -Value $lines -Encoding utf8
          Start-Process notepad.exe $out
          '@
          Set-Content -Path $script -Value $body -Encoding utf8
          $lnk = 'C:\Users\Public\Desktop\Roblox Diagnose.lnk'
          $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          $sh.TargetPath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $sh.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$script`""
          $sh.Save()
          if (-not (Test-Path $lnk)) { throw 'Shortcut was not created.' }

      - name: Add Claude Desktop download shortcut to the desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'C:\Users\Public\Desktop\Download Claude Desktop.url'
          Set-Content -Path $path -Value "[InternetShortcut]`r`nURL=https://claude.com/download" -Encoding ascii
          if (-not (Test-Path $path)) { throw 'Shortcut was not created.' }

      - name: Install Blender
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Assumption, not verified by me: Chocolatey (preinstalled on GitHub Windows runners) has a 'blender' package.
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) { throw 'choco is not available on this runner.' }
          choco install blender -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install blender exited with code $LASTEXITCODE." }
          $exe = Get-ChildItem -Path "$env:ProgramFiles\Blender Foundation" -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'blender.exe not found after install.' }
          $lnk = 'C:\Users\Public\Desktop\Blender.lnk'
          if (-not (Test-Path $lnk)) {
            $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
            $sh.TargetPath = $exe.FullName
            $sh.WorkingDirectory = $exe.DirectoryName
            $sh.Save()
          }
          Write-Host "Blender installed: $($exe.FullName)"

      - name: Enable software OpenGL (Mesa llvmpipe) for Blender
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $exe = Get-ChildItem -Path "$env:ProgramFiles\Blender Foundation" -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'blender.exe not found; the Install Blender step did not succeed.' }
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and (Test-Path "$env:ProgramFiles\7-Zip\7z.exe")) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not $sevenZip) { throw '7z is not available on this runner.' }
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe.7z'
          $out = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe'
          Invoke-WebRequest -Uri $env:MESA_LLVMPIPE_URL -OutFile $archive -UseBasicParsing
          if ((Get-Item $archive).Length -lt 1MB) { throw 'Mesa archive is unexpectedly small.' }
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          & $sevenZip x $archive "-o$out" opengl32.dll -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE." }
          $dll = Join-Path $out 'opengl32.dll'
          $head = [System.IO.File]::ReadAllBytes($dll)[0..1]
          if (-not (Test-Path $dll) -or (Get-Item $dll).Length -lt 1MB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw 'Extracted opengl32.dll is missing or not a valid DLL.' }
          # Blender loads opengl32.dll from its own folder first, so this overrides the runner's GPU-less system OpenGL.
          Copy-Item -Path $dll -Destination (Join-Path $exe.DirectoryName 'opengl32.dll') -Force
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Mesa llvmpipe opengl32.dll installed next to $($exe.FullName)"

      - name: Install Claude Desktop
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = $env:CLAUDE_MSIX_URL
          if ([string]::IsNullOrWhiteSpace($url)) {
            # Unset on purpose: no verified MSIX URL was given. Fall back to winget (id unverified by me).
            if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw 'CLAUDE_MSIX_URL is unset and winget is not available. Set CLAUDE_MSIX_URL in the workflow env.' }
            winget install --id Anthropic.Claude -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "winget install Anthropic.Claude exited with code $LASTEXITCODE." }
            return
          }
          $msixPath = Join-Path $env:TEMP 'Claude.msix'
          Invoke-WebRequest -Uri $url -OutFile $msixPath -UseBasicParsing
          # An MSIX is a zip: reject an HTML page or a stub before provisioning.
          $f = Get-Item $msixPath
          $head = [System.IO.File]::ReadAllBytes($msixPath)[0..1]
          if ($f.Length -lt 1MB -or $head[0] -ne 0x50 -or $head[1] -ne 0x4B) { Remove-Item $msixPath -Force; throw "Downloaded file is not an MSIX package ($($f.Length) bytes). Check CLAUDE_MSIX_URL." }
          # Provisioned system-wide; it registers for the RDP user at that user's first sign-in.
          Add-AppxProvisionedPackage -Online -PackagePath $msixPath -SkipLicense | Out-Null
          Remove-Item $msixPath -Force -ErrorAction SilentlyContinue
          Write-Host 'Claude Desktop provisioned. It appears after the RDP user signs in.'

      - name: Disable Windows Test Mode and restart
        if: ${{ inputs.disable_test_mode }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Before:'
          bcdedit /enum '{current}'
          bcdedit /set testsigning off
          if ($LASTEXITCODE -ne 0) { throw "bcdedit /set testsigning off exited with code $LASTEXITCODE; not restarting." }
          Write-Host 'After:'
          bcdedit /enum '{current}'
          # Assumption, not verified by me: Tailscale (unattended service), RDP and the local user survive the restart, so the PC comes back on the tailnet. A hosted runner may end the job when it restarts.
          Write-Host 'Restarting in 15 seconds. Reconnect over Tailscale and RDP after about 2 minutes.'
          shutdown /r /t 15 /c 'Disable Test Mode'
          Start-Sleep -Seconds 180

      - name: Keep session alive
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes([int]$env:SESSION_MINUTES)
          # Leave about 15 minutes before the 355-minute job timeout (6 h runner limit) for the final save and handover.
          $hardEnd = ([datetime]::Parse($env:JOB_START_UTC, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)).ToLocalTime().AddMinutes(340)
          if ($end -gt $hardEnd) { $end = $hardEnd; Write-Host 'Session length was shortened so the final save fits inside the runner time limit.' }
          Write-Host "Session ends at $($end.ToUniversalTime().ToString('u'))"
          $nextSave = (Get-Date).AddMinutes(30)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            if ((Get-Service -Name TermService).Status -ne 'Running') { throw 'TermService stopped.' }
            if ((Get-Date) -ge $nextSave) {
              try { & "$env:GITHUB_WORKSPACE\scripts\save-state.ps1" } catch { Write-Host "Autosave failed: $_" }
              $nextSave = (Get-Date).AddMinutes(30)
            }
          }

      - name: Save state
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/save-state.ps1

      - name: Start the next Cloud PC run
        if: ${{ success() && inputs.auto_continue }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh workflow run cloud-pc.yml --ref main -f minutes=$env:SESSION_MINUTES -f username=$env:RDP_USERNAME -f auto_continue=true
          if ($LASTEXITCODE -ne 0) { throw "Could not start the next run (exit code $LASTEXITCODE)." }
          Write-Host 'Next run requested. This run is replaced when it starts.'
