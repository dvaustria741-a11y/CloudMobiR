      - name: Enable software OpenGL (Mesa llvmpipe) for Blender
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $exe = Get-ChildItem -Path "$env:ProgramFiles\Blender Foundation" -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'blender.exe not found; the Install Blender step did not succeed.' }
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and (Test-Path "$env:ProgramFiles\7-Zip\7z.exe")) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not $sevenZip) { throw '7z is not available on this runner.' }
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe.7z'
          $out = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe'
          Invoke-WebRequest -Uri $env:MESA_LLVMPIPE_URL -OutFile $archive -UseBasicParsing
          if ((Get-Item $archive).Length -lt 1MB) { throw 'Mesa archive is unexpectedly small.' }
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          & $sevenZip x $archive "-o$out" opengl32.dll -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE." }
          $dll = Join-Path $out 'opengl32.dll'
          $head = [System.IO.File]::ReadAllBytes($dll)[0..1]
          if (-not (Test-Path $dll) -or (Get-Item $dll).Length -lt 1MB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw 'Extracted opengl32.dll is missing or not a valid DLL.' }
          # Blender loads opengl32.dll from its own folder first, so this overrides the runner's GPU-less system OpenGL.
          Copy-Item -Path $dll -Destination (Join-Path $exe.DirectoryName 'opengl32.dll') -Force
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Mesa llvmpipe opengl32.dll installed next to $($exe.FullName)"

      - name: Install Claude Desktop
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $setup = Join-Path $env:TEMP 'Claude-Setup.exe'
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          # The direct file URL first (no challenge page in front of it), then the two claude.ai redirects.
          $urls = @($env:CLAUDE_SETUP_DIRECT_URL, $env:CLAUDE_SETUP_URL, $env:CLAUDE_SETUP_URL_FALLBACK) | Where-Object { $_ -and $_.Trim() }
          $ok = $false
          foreach ($u in $urls) {
            Remove-Item $setup -Force -ErrorAction SilentlyContinue
            try {
              $resp = Invoke-WebRequest -Uri $u -OutFile $setup -UserAgent $ua -MaximumRedirection 10 -UseBasicParsing -PassThru
              Write-Host "Fetched $u -> $($resp.BaseResponse.ResponseUri)  Content-Type: $($resp.Headers['Content-Type'])"
            } catch {
              $status = ''
              $mitigated = ''
              if ($_.Exception.Response) {
                $status = [int]$_.Exception.Response.StatusCode
                $mitigated = $_.Exception.Response.Headers['cf-mitigated']
              }
              Write-Host "Skipped $u : HTTP '$status' cf-mitigated '$mitigated'. A Cloudflare challenge cannot be passed from this runner."
              continue
            }
            if (-not (Test-Path $setup)) { Write-Host "No file written for $u"; continue }
            $f = Get-Item $setup
            $head = [System.IO.File]::ReadAllBytes($setup)[0..1]
            if ($f.Length -lt 1MB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
              Write-Host "Skipped $u : the download is not a Windows executable ($($f.Length) bytes)."
              continue
            }
            $sig = Get-AuthenticodeSignature $setup
            Write-Host "Signature: $($sig.Status), signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Host "Skipped $u : no valid Authenticode signature."; continue }
            $ok = $true
            break
          }
          if ($ok) {
            # Always leave the real installer on the desktop, so the RDP user can run it as themselves if the silent run below does nothing.
            Copy-Item $setup 'C:\Users\Public\Desktop\Claude Setup.exe' -Force
            # The installer's silent switch is not verified by me; the run is bounded and its exit code logged, never fatal.
            $p = Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru
            if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; Write-Host 'Silent install did not finish in 5 minutes and was stopped. Run "Claude Setup" from the desktop.' }
            else { Write-Host "Installer exited with code $($p.ExitCode). If Claude is missing after sign-in, run 'Claude Setup' from the desktop." }
            Remove-Item $setup -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host 'No Claude installer URL worked. Trying winget (package id Anthropic.Claude, from the winget manifest listing; not verified on this runner).'
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              & winget install --id Anthropic.Claude --exact --silent --accept-package-agreements --accept-source-agreements
              Write-Host "winget exited with code $LASTEXITCODE"
              if ($LASTEXITCODE -ne 0) { throw 'Claude Desktop winget install failed.' }
            } else {
              Write-Host 'winget is not available on this runner. Use the "Download Claude Desktop" shortcut on the desktop, or set CLAUDE_SETUP_DIRECT_URL to a newer file URL.'
              throw 'Claude Desktop download failed.'
            }
          }

      - name: Set Claude Desktop MCP config (Roblox Studio)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The whole claude_desktop_config.json is replaced with this, as requested. Claude Desktop's own keys in that file are dropped.
          $body = @'
          {
            "mcpServers": {
              "Roblox_Studio": {
                "command": "cmd.exe",
                "args": [
                  "/c",
                  "cd /d %LOCALAPPDATA%\\Roblox && .\\mcp.bat"
                ]
              }
            }
          }
          '@
          $null = $body | ConvertFrom-Json   # throws if the JSON is malformed

          # The RDP user's profile may not exist yet (Windows creates it at first sign-in, and a folder made beforehand can end up as a duplicate profile), so the file is kept in a shared folder and copied into %APPDATA%\Claude at every sign-in by an all-users Startup script.
          $shared = 'C:\ProgramData\CloudMobiR'
          New-Item -ItemType Directory -Force -Path $shared | Out-Null
          Set-Content -Path (Join-Path $shared 'claude_desktop_config.json') -Value $body -Encoding utf8

          $startup = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
          $cmd = "@echo off`r`nif not exist `"%APPDATA%\Claude`" mkdir `"%APPDATA%\Claude`"`r`ncopy /Y `"$shared\claude_desktop_config.json`" `"%APPDATA%\Claude\claude_desktop_config.json`" >nul`r`n"
          Set-Content -Path (Join-Path $startup 'claude-mcp-config.cmd') -Value $cmd -Encoding ascii

          # If the profile is already there (restored state), apply it now as well.
          $dir = "C:\Users\$env:RDP_USERNAME\AppData\Roaming\Claude"
          if (Test-Path $dir) {
            Copy-Item (Join-Path $shared 'claude_desktop_config.json') (Join-Path $dir 'claude_desktop_config.json') -Force
            Write-Host "Replaced $dir\claude_desktop_config.json"
          } else {
            Write-Host 'Profile not created yet; the config is applied at the first sign-in.'
          }


      - name: Build + install live video wallpaper
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Self-contained C# WPF app compiled on the runner with csc.exe + WPF refs.
          # On first sign-in it runs from Startup, finds the WorkerW window behind the
          # desktop icons, and loops the MP4 there using Windows.Media.Playback.
          # No external downloads needed — everything ships with .NET Framework 4.x.

          $appDir  = 'C:\ProgramData\VideoWallpaper'
          $srcPath = "$appDir\vw.cs"
          $exePath = "$appDir\vw.exe"
          $wpDest  = "$appDir\wallpaper.mp4"
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null

          # Copy video from repo
          $wpSrc = Join-Path $env:GITHUB_WORKSPACE 'assets\wallpaper.mp4'
          Copy-Item -Path $wpSrc -Destination $wpDest -Force
          Write-Host "Video copied: $wpDest ($([math]::Round((Get-Item $wpDest).Length/1KB,0)) KB)"

          # C# source — WPF window with MediaElement looping, parented to WorkerW
          $lines = @(
            'using System;',
            'using System.Diagnostics;',
            'using System.Runtime.InteropServices;',
            'using System.Windows;',
            'using System.Windows.Controls;',
            'using System.Windows.Media;',
            'class VideoWallpaper {',
            '  [DllImport("user32.dll")] static extern IntPtr FindWindow(string c, string w);',
            '  [DllImport("user32.dll")] static extern IntPtr FindWindowEx(IntPtr p, IntPtr a, string c, string w);',
            '  [DllImport("user32.dll")] static extern IntPtr SetParent(IntPtr c, IntPtr p);',
            '  [DllImport("user32.dll")] static extern bool SetWindowPos(IntPtr h, IntPtr i, int x, int y, int w, int ht, uint f);',
            '  [DllImport("user32.dll")] static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);',
            '  [STAThread] static void Main(string[] args) {',
            '    string path = args.Length > 0 ? args[0] : System.IO.Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "wallpaper.mp4");',
            '    var app = new Application();',
            '    var win = new Window {',
            '      WindowStyle = WindowStyle.None,',
            '      ResizeMode = ResizeMode.NoResize,',
            '      ShowInTaskbar = false,',
            '      Left = 0, Top = 0,',
            '      Width = SystemParameters.PrimaryScreenWidth,',
            '      Height = SystemParameters.PrimaryScreenHeight',
            '    };',
            '    var me = new MediaElement {',
            '      Source = new Uri(path),',
            '      LoadedBehavior = MediaState.Manual,',
            '      UnloadedBehavior = MediaState.Stop,',
            '      Stretch = Stretch.UniformToFill,',
            '      IsMuted = true',
            '    };',
            '    me.MediaEnded += (s, e) => { me.Position = TimeSpan.Zero; me.Play(); };',
            '    win.Content = me;',
            '    win.Loaded += (s, e) => {',
            '      var progman = FindWindow("Progman", null);',
            '      SendMessage(progman, 0x052C, new IntPtr(0), new IntPtr(0));',
            '      IntPtr workerw = IntPtr.Zero;',
            '      EnumWindows((hwnd, lp) => {',
            '        var p = FindWindowEx(hwnd, IntPtr.Zero, "SHELLDLL_DefView", null);',
            '        if (p != IntPtr.Zero) workerw = FindWindowEx(IntPtr.Zero, hwnd, "WorkerW", null);',
            '        return true;',
            '      }, IntPtr.Zero);',
            '      var helper = new System.Windows.Interop.WindowInteropHelper(win);',
            '      SetParent(helper.Handle, workerw != IntPtr.Zero ? workerw : progman);',
            '      me.Play();',
            '    };',
            '    app.Run(win);',
            '  }',
            '  delegate bool EnumWindowsProc(IntPtr h, IntPtr lp);',
            '  [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc cb, IntPtr lp);',
            '}'
          )
          Set-Content -Path $srcPath -Value ($lines -join "`r`n") -Encoding ascii

          # Find latest csc.exe
          $csc = Get-ChildItem 'C:\Windows\Microsoft.NET\Framework64' -Filter csc.exe -Recurse |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $csc) { throw 'csc.exe not found' }
          Write-Host "csc: $($csc.FullName)"

          # WPF refs shipped with .NET Framework
          $wpfBase = 'C:\Windows\Microsoft.NET\Framework64'
          $refs = @(
            'PresentationFramework.dll',
            'PresentationCore.dll',
            'WindowsBase.dll',
            'System.dll',
            'System.Xaml.dll'
          )
          $refArgs = $refs | ForEach-Object {
            $found = Get-ChildItem $wpfBase -Filter $_ -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) { "/r:`"$($found.FullName)`"" }
          }

          $compileArgs = @('/nologo', '/target:winexe', "/out:`"$exePath`"") + $refArgs + @("`"$srcPath`"")
          & $csc.FullName @compileArgs
          if (-not (Test-Path $exePath)) { throw "Compile failed" }
          Write-Host "Compiled: $exePath"

          # All-users Startup script — runs vw.exe on every sign-in
          $startup = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
          $bat = Join-Path $startup 'video-wallpaper.cmd'
          Set-Content -Path $bat -Value "@echo off`r`nstart /min `"VideoWallpaper`" `"$exePath`" `"$wpDest`"`r`n" -Encoding ascii
          Write-Host "Startup script: $bat"

      - name: Keep session alive
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes([int]$env:SESSION_MINUTES)
          # Leave about 15 minutes before the 355-minute job timeout (6 h runner limit) for the final save and handover.
          $hardEnd = ([datetime]::Parse($env:JOB_START_UTC, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)).ToLocalTime().AddMinutes(340)
          if ($end -gt $hardEnd) { $end = $hardEnd; Write-Host 'Session length was shortened so the final save fits inside the runner time limit.' }
          Write-Host "Session ends at $($end.ToUniversalTime().ToString('u'))"
          $handoverAt = $end.AddMinutes(-20)
          $handedOver = $false
          $handoverTries = 0
          $nextSave = (Get-Date).AddMinutes(30)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            if ((Get-Service -Name TermService).Status -ne 'Running') { throw 'TermService stopped.' }
            if (-not $handedOver -and $env:AUTO_CONTINUE -eq 'true' -and $handoverTries -lt 5 -and (Get-Date) -ge $handoverAt) {
              $handoverTries++
              # Save first, so the new PC restores the newest state, then start the next run while this PC stays usable.
              $marker = Join-Path $env:RUNNER_TEMP 'last-save-ok.txt'
              Remove-Item $marker -Force -ErrorAction SilentlyContinue
              try { & "$env:GITHUB_WORKSPACE\scripts\save-state.ps1" } catch { Write-Host "Handover save failed: $_" }
              if (Test-Path $marker) {
                gh workflow run cloud-pc.yml --ref main -f minutes=$env:SESSION_MINUTES -f username=$env:RDP_USERNAME -f performance_tweaks=$env:PERF_TWEAKS -f auto_continue=true -f previous_run=$env:GITHUB_RUN_ID
                if ($LASTEXITCODE -eq 0) {
                  $handedOver = $true
                  'HANDED_OVER=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  Write-Host '=== HANDOVER: the next Cloud PC run was started. In about 10-15 minutes a new device named cloudpc-<run number> appears in Tailscale. Save your work in Studio, then move to the new PC. Changes made on this PC after this point are NOT saved. ==='
                } else { Write-Host "Could not start the next run (exit code $LASTEXITCODE); try $handoverTries of 5." }
              } else { Write-Host "Handover save did not succeed (is STATE_PASSWORD set?); try $handoverTries of 5." }
            }
            elseif (-not $handedOver -and (Get-Date) -ge $nextSave) {
              try { & "$env:GITHUB_WORKSPACE\scripts\save-state.ps1" } catch { Write-Host "Autosave failed: $_" }
              $nextSave = (Get-Date).AddMinutes(30)
            }
          }

      - name: Save state
        if: ${{ always() && env.HANDED_OVER != '1' }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/save-state.ps1




