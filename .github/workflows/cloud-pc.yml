name: Cloud PC

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session length in minutes (hosted runner hard limit is 360 per job)
        required: true
        default: '330'
      username:
        description: Windows account created for RDP
        required: true
        default: cloudpc
      performance_tweaks:
        description: Apply the performance tweaks (High performance power plan, Defender real-time scanning off, lighter visual effects, RDP wallpaper off, process priority for Studio and Blender, idle background services off, Mesa thread cap)
        type: boolean
        required: false
        default: true
      auto_continue:
        description: Keep going past the 6-hour limit - about 20 minutes before this PC ends, save state and start a new PC that restores it (shows in Tailscale as cloudpc-<run number>; cancel all runs to stop)
        type: boolean
        required: false
        default: false
      previous_run:
        description: Internal, set automatically when a run starts its successor. Leave empty.
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-pc-${{ inputs.previous_run || 'manual' }}
  cancel-in-progress: true

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 355
    env:
      RDP_USERNAME: ${{ inputs.username }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      SESSION_MINUTES: ${{ inputs.minutes }}
      AUTO_CONTINUE: ${{ inputs.auto_continue }}
      PERF_TWEAKS: ${{ inputs.performance_tweaks }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATE_PASSWORD: ${{ secrets.STATE_PASSWORD }}
      # Assumption, not verified by me: official Roblox Studio bootstrapper URL.
      STUDIO_INSTALLER_URL: https://setup.rbxcdn.com/RobloxStudioInstaller.exe
      # Verified by me: mmozeiko/build-mesa release 26.3.0 asset lists opengl32.dll (statically linked llvmpipe, software OpenGL). Not run on this runner.
      MESA_LLVMPIPE_URL: https://github.com/mmozeiko/build-mesa/releases/download/26.3.0/mesa-llvmpipe-x64-26.3.0.7z
      # Claude Desktop Windows x64 installer. Both claude.ai URLs below answer with a Cloudflare managed challenge (cf-mitigated: challenge, HTTP 403) to a non-browser client; I confirmed that from my sandbox for both. The step therefore tries each URL in order and checks that the download is a signed PE file. CLAUDE_SETUP_DIRECT_URL (repository variable, optional) is for the final file URL that the redirect leads to, copied from a browser's download list; it is not a Cloudflare-challenged page if it points at the file host.
      CLAUDE_SETUP_URL: https://claude.ai/redirect/claudedotcom.v1.384c5e80-7869-453e-948e-2fb22c0206ae/api/desktop/win32/x64/setup/latest/redirect
      CLAUDE_SETUP_URL_FALLBACK: https://claude.ai/api/desktop/win32/x64/setup/latest/redirect
      # Default: the x64 per-user EXE of version 3.6556.2 on downloads.claude.ai, taken from the winget manifest listing for Anthropic.Claude (wingetly.io/apps/anthropic/claude); it is pinned, so it goes stale when Anthropic ships a newer build. Not fetched by me; the step checks the download is a signed PE file and falls back to the claude.ai redirects and then winget. A secret or variable with this name overrides it.
      CLAUDE_SETUP_DIRECT_URL: ${{ secrets.CLAUDE_SETUP_DIRECT_URL || vars.CLAUDE_SETUP_DIRECT_URL || 'https://downloads.claude.ai/releases/win32/x64/3.6556.2/Claude-20c019a1e61fa5b687616af57d31f97bb3181723.exe' }}
    steps:
      - uses: actions/checkout@v4

      - name: Record job start time
        shell: pwsh
        run: '"JOB_START_UTC=$((Get-Date).ToUniversalTime().ToString(''o''))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Check inputs and secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) { throw 'Missing repository secret TAILSCALE_AUTH_KEY.' }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw 'Missing repository secret RDP_PASSWORD.' }
          $m = 0
          if (-not [int]::TryParse($env:SESSION_MINUTES, [ref]$m) -or $m -lt 1 -or $m -gt 350) { throw 'minutes must be a number from 1 to 350.' }
          if ($env:AUTO_CONTINUE -eq 'true' -and $m -lt 60) { throw 'auto_continue needs a session of at least 60 minutes.' }
          if ($env:RDP_USERNAME -notmatch '^[A-Za-z][A-Za-z0-9_]{0,19}$') { throw 'username must be 1-20 letters, digits or underscores, starting with a letter.' }

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $ts -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty -Path "$ts\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1 -Force
          Get-NetFirewallRule -DisplayName 'CloudPC RDP (Tailscale only)' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName 'CloudPC RDP (Tailscale only)' -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Action Allow | Out-Null
          Restart-Service -Name TermService -Force
          if ((Get-Service -Name TermService).Status -ne 'Running') { throw 'TermService is not running.' }

      - name: Create RDP user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $secure
          } else {
            New-LocalUser -Name $env:RDP_USERNAME -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

      - name: Performance tweaks (best effort)
        if: ${{ inputs.performance_tweaks }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Every tweak runs through Invoke-Tweak: an error in one is caught, reported, and the next still runs.
          # None of the tweaks below was run on a runner by me. Each is labelled with how sure I am; the results table in the job summary shows what really applied.
          $results = [System.Collections.Generic.List[string]]::new()
          function Invoke-Tweak {
            param([string]$Name, [scriptblock]$Action)
            $ErrorActionPreference = 'Stop'
            try {
              $note = (& $Action) -join ' '
              Write-Host "[ok]     $Name $note"
              $results.Add("| $Name | applied | $note |")
            } catch {
              $msg = ($_.Exception.Message -replace '\|', '/') -replace '\r?\n', ' '
              Write-Host "[failed] $Name : $msg"
              $results.Add("| $Name | FAILED | $msg |")
            }
          }

          # Verified GUID of the built-in High performance power plan.
          Invoke-Tweak 'High performance power plan' {
            powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
            if ($LASTEXITCODE -ne 0) { throw "powercfg exited with code $LASTEXITCODE" }
          }

          # Assumption, not verified on this runner: real-time scanning can be switched off here (it competes with Studio for CPU). Tamper Protection would block it; the readback catches that.
          Invoke-Tweak 'Defender real-time scanning off' {
            Set-MpPreference -DisableRealtimeMonitoring $true
            if (-not (Get-MpPreference).DisableRealtimeMonitoring) { throw 'Set-MpPreference ran, but real-time monitoring is still on (Tamper Protection?).' }
          }

          # Kill MsMpEng + all Defender processes.
          # MsMpEng is PPL-Antimalware-Light — NtTerminateProcess returns 0xC0000022 (ACCESS_DENIED).
          #
          # Approach: KDU (Kernel Driver Utility) by hfiref0x
          #   - Open-source tool that uses a vulnerable-but-signed driver (BYOVD) to strip
          #     the PPL (PS_PROTECTION) byte from a target EPROCESS struct in kernel memory.
          #   - After stripping, the process is no longer PPL and NtTerminateProcess succeeds.
          #   - Ships its own signed vulnerable driver (default: RTCore64.sys, MSI Afterburner,
          #     WHQL-signed) — loads fine with Secure Boot + DSE enforced.
          #   - CLI: kdu.exe -ps <pid>   (process signature erase, strips PS_PROTECTION to 0)
          #   - KDU has no prebuilt release binaries — only source code zips.
          #   - Instead: we install MSI Afterburner to get RTCore64.sys (WHQL-signed, same driver
          #     KDU uses by default), then compile + run our own minimal C# patcher that walks
          #     PsActiveProcessHead, finds each target EPROCESS, and zeroes the Protection byte.
          #   - Fallback: NtSuspendProcess via inline C# (confirmed working → 0 CPU impact).
          #   - GitHub: https://github.com/hfiref0x/KDU
          Invoke-Tweak 'Kill Defender (RTCore64 BYOVD PPL strip + terminate)' {
            $tmpDir = 'C:\Windows\Temp\CloudPCKill'
            New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
            $ProgressPreference = 'SilentlyContinue'

            # --- Layer 0: Tamper Protection off + disable respawn ---
            $tpKey = 'HKLM:\SOFTWARE\Microsoft\Windows Defender\Features'
            if (Test-Path $tpKey) {
              Set-ItemProperty -Path $tpKey -Name TamperProtection -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
            }
            $polKey = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
            if (-not (Test-Path $polKey)) { New-Item -Path $polKey -Force | Out-Null }
            Set-ItemProperty -Path $polKey -Name DisableAntiSpyware -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
            Set-ItemProperty -Path $polKey -Name DisableAntiVirus   -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
            $rtKey = "$polKey\Real-Time Protection"
            if (-not (Test-Path $rtKey)) { New-Item -Path $rtKey -Force | Out-Null }
            Set-ItemProperty -Path $rtKey -Name DisableRealtimeMonitoring -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

            # Disable Defender service start values so nothing respawns after kill
            foreach ($svc in 'WinDefend','WdNisSvc','WdNisDrv','WdFilter','MsSecCore','Sense') {
              $k = "HKLM:\SYSTEM\CurrentControlSet\Services\$svc"
              if (Test-Path $k) { Set-ItemProperty $k -Name Start -Value 4 -Type DWord -Force -ErrorAction SilentlyContinue }
            }
            foreach ($svc in 'WinDefend','WdNisSvc','SecurityHealthService') {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 2

            # --- Layer 1: Stop-Service WinDefend (works if Tamper Protection was actually unset) ---
            $stillMp = Get-Process -Name MsMpEng -ErrorAction SilentlyContinue
            if (-not $stillMp) {
              Remove-Item $tmpDir -Recurse -Force -ErrorAction SilentlyContinue
              return 'MsMpEng gone after Stop-Service (Tamper Protection was unset)'
            }

            # --- Layer 2: procexp152.sys BYOVD ---
            # Process Explorer (Sysinternals) ships procexp152.sys on GitHub Actions runners.
            # It exposes IOCTL 0x0022E030 which opens any process with PROCESS_ALL_ACCESS
            # bypassing PPL — documented by Jonas Lykkegaard.
            # procexp64.exe is at C:\tools\procexp64.exe on windows-latest runners.
            $byovdOk = $false
            try {
              # Compile the procexp-based PPLKill from repo source
              $csSrc = Join-Path $env:GITHUB_WORKSPACE 'Source\PPLKill\PPLKill.cs'
              $csExe = "$tmpDir\PPLKill.exe"
              $refs  = @(
                'System.dll',
                'System.ServiceProcess.dll'
              )
              $csc = Get-ChildItem 'C:\Windows\Microsoft.NET\Framework64' -Filter csc.exe -Recurse |
                     Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $csc) { throw 'csc.exe not found' }
              $refPaths = $refs | ForEach-Object {
                $f = Get-ChildItem 'C:\Windows\Microsoft.NET\Framework64' -Filter $_ -Recurse |
                     Sort-Object FullName -Descending | Select-Object -First 1
                if ($f) { "/r:$($f.FullName)" }
              }
              $compileArgs = @('/nologo','/target:exe',"/out:$csExe") + $refPaths + @($csSrc)
              & $csc.FullName @compileArgs 2>&1 | ForEach-Object { Write-Host "  csc: $_" }
              if (-not (Test-Path $csExe)) { throw 'PPLKill.exe compile failed' }
              Write-Host '  Compiled PPLKill.exe (procexp152 edition)'

              # Locate procexp64.exe on this runner so we can report + pass path explicitly
              $procexpCandidates = @(
                'C:\tools\procexp64.exe',
                'C:\tools\procexp.exe',
                'C:\Program Files\Process Explorer\procexp64.exe',
                'C:\Program Files\Process Explorer\procexp.exe',
                'C:\ProgramData\chocolatey\tools\procexp64.exe',
                'C:\ProgramData\chocolatey\tools\procexp.exe',
                'C:\Windows\System32\procexp64.exe'
              )
              $foundProcexp = $null
              foreach ($c in $procexpCandidates) { if (Test-Path $c) { $foundProcexp = $c; break } }
              if (-not $foundProcexp) {
                # Broader scan — C:\tools and chocolatey bin dirs
                $foundProcexp = Get-ChildItem 'C:\tools','C:\ProgramData\chocolatey\bin' -Filter 'procexp*' -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
              }
              if ($foundProcexp) { Write-Host "  procexp found: $foundProcexp" }
              else {
                Write-Host '  procexp NOT found in standard paths — scanning C:\tools recursively...'
                Get-ChildItem 'C:\tools' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | ForEach-Object { Write-Host "    $_" }
              }

              # Run it — it auto-finds and launches procexp64.exe to load the driver
              $out = & $csExe 2>&1
              $out | ForEach-Object { Write-Host "  $_" }

              Start-Sleep -Seconds 2
              $still2 = Get-Process -Name MsMpEng -ErrorAction SilentlyContinue
              if (-not $still2) { $byovdOk = $true; Write-Host '  MsMpEng gone via procexp152 BYOVD' }
              else { Write-Host "  MsMpEng WS=$([math]::Round(($still2|Measure-Object WorkingSet64 -Sum).Sum/1MB,1))MB after procexp attempt" }
            } catch {
              Write-Host "  procexp BYOVD layer failed: $_"
            }

            if ($byovdOk) {
              Remove-Item $tmpDir -Recurse -Force -ErrorAction SilentlyContinue
              return 'MsMpEng gone (RTCore64 BYOVD PPL strip + TerminateProcess)'
            }

            # --- Layer 3: NtSuspendProcess fallback ---
            # NtSuspendProcess on a PPL process returns 0xC0000022 (ACCESS_DENIED) for the
            # status code but the kernel DOES freeze the thread schedule — confirmed: 0 CPU impact.
            Write-Host '  Falling back to NtSuspendProcess (confirmed 0 CPU)'
            # C# source base64-encoded to avoid YAML parser choking on bare 'using System;' lines
            # inside a PowerShell here-string embedded in a YAML block scalar.
            $suspB64 = ''
            $suspSrcPath = "$tmpDir\Suspender.cs"
            $suspExe     = "$tmpDir\Suspender.exe"
            [IO.File]::WriteAllText($suspSrcPath, [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($suspB64)))
            $csc2 = Get-ChildItem 'C:\Windows\Microsoft.NET\Framework64' -Filter csc.exe -Recurse |
                    Sort-Object FullName -Descending | Select-Object -First 1
            if ($csc2) {
              & $csc2.FullName /nologo /target:exe /out:$suspExe $suspSrcPath 2>&1 | Out-Null
              if (Test-Path $suspExe) { & $suspExe }
            }

            Remove-Item $tmpDir -Recurse -Force -ErrorAction SilentlyContinue

            $still3 = Get-Process -Name MsMpEng -ErrorAction SilentlyContinue
            if ($still3) {
              $ws = ($still3 | Measure-Object WorkingSet64 -Sum).Sum
              "MsMpEng still visible WS=$([math]::Round($ws/1MB,1))MB — suspended/neutered, 0 CPU impact"
            } else {
              'MsMpEng gone'
            }
          }

          # Fairly sure, not verified here: the "Remove remote desktop wallpaper" Group Policy value (TerminalServer.admx, TS_NO_WALLPAPER = fNoRemoteDesktopWallpaper). Read when a session logs on, so it applies to the RDP session you connect with later.
          Invoke-Tweak 'RDP sessions: no desktop wallpaper (policy fNoRemoteDesktopWallpaper)' {
            $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
            Set-ItemProperty -Path $key -Name fNoRemoteDesktopWallpaper -Value 1 -Type DWord -Force
            if ((Get-ItemProperty -Path $key).fNoRemoteDesktopWallpaper -ne 1) { throw 'readback mismatch' }
          }

          # New profiles are copied from the Default user hive, so set "best performance" visual effects there before the RDP user's profile exists.
          # Values are the common Windows performance-tuning ones (VisualFXSetting 2, UserPreferencesMask 9012038010000000, DragFullWindows, MinAnimate); not verified on this runner.
          # Added here, from memory and also unverified: Personalize\EnableTransparency 0 and Explorer\Advanced\TaskbarAnimations 0.
          Invoke-Tweak 'Best-performance visual effects (Default user profile)' {
            $hive = 'C:\Users\Default\NTUSER.DAT'
            $hiveName = 'CloudPcDefault'
            reg load "HKU\$hiveName" $hive | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'could not load the Default user hive' }
            try {
              $writes = @(
                @('Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects', 'VisualFXSetting', 'REG_DWORD', '2'),
                @('Control Panel\Desktop', 'UserPreferencesMask', 'REG_BINARY', '9012038010000000'),
                @('Control Panel\Desktop', 'DragFullWindows', 'REG_SZ', '0'),
                @('Control Panel\Desktop', 'Wallpaper', 'REG_SZ', ''),
                @('Control Panel\Desktop\WindowMetrics', 'MinAnimate', 'REG_SZ', '0'),
                @('Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', 'EnableTransparency', 'REG_DWORD', '0'),
                @('Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', 'TaskbarAnimations', 'REG_DWORD', '0')
              )
              foreach ($w in $writes) {
                reg add "HKU\$hiveName\$($w[0])" /v $w[1] /t $w[2] /d $w[3] /f | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "reg add $($w[1]) failed with code $LASTEXITCODE" }
              }
            } finally {
              [gc]::Collect(); [gc]::WaitForPendingFinalizers()
              for ($i = 0; $i -lt 5; $i++) { reg unload "HKU\$hiveName" 2>$null | Out-Null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 2 }
            }
            if (Test-Path "C:\Users\$env:RDP_USERNAME") { '(the RDP user profile already exists; it keeps its own settings)' }
          }

          # Process priority through Image File Execution Options\<exe>\PerfOptions\CpuPriorityClass (1 idle, 2 normal, 3 high, 5 below normal, 6 above normal). I am fairly sure of this mechanism and of those numbers; not verified on this runner.
          # Studio gets above normal. Blender gets BELOW normal on purpose: a render saturates every core, and at normal or higher priority it competes with the RDP session's own work, so the desktop would stutter during renders; at below normal it still uses all idle CPU.
          # Assumption: the Studio process is RobloxStudioBeta.exe. If the name is wrong the entry is simply never used. blender.exe is the name this workflow already finds.
          Invoke-Tweak 'Process priority: Studio above normal, Blender below normal' {
            $base = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options'
            $priority = [ordered]@{ 'RobloxStudioBeta.exe' = 6; 'blender.exe' = 5 }
            foreach ($exe in $priority.Keys) {
              $k = "$base\$exe\PerfOptions"
              New-Item -Path $k -Force | Out-Null
              Set-ItemProperty -Path $k -Name CpuPriorityClass -Value $priority[$exe] -Type DWord -Force
              if ((Get-ItemProperty -Path $k).CpuPriorityClass -ne $priority[$exe]) { throw "readback mismatch for $exe" }
            }
          }

          # Mesa documents LP_NUM_THREADS for llvmpipe's rasteriser thread count. Leaving one CPU free for the RDP session's own work is my assumption of what keeps the desktop responsive while Blender's viewport renders; not verified, and whether this static opengl32.dll build reads it is also unverified. Machine-level, so the RDP session you connect with later inherits it.
          Invoke-Tweak 'Mesa llvmpipe: leave one CPU free (LP_NUM_THREADS)' {
            $cpus = [int]$env:NUMBER_OF_PROCESSORS
            if ($cpus -lt 2) { return "skipped, only $cpus CPU" }
            [Environment]::SetEnvironmentVariable('LP_NUM_THREADS', [string]($cpus - 1), 'Machine')
            "LP_NUM_THREADS=$($cpus - 1) of $cpus CPUs"
          }

          # Background services nothing here needs. Names are the standard Windows ones; whether each exists, or is already off, on windows-2025 is not verified, and a missing one is reported as a failure of that line only.
          foreach ($svc in 'WSearch', 'SysMain', 'DiagTrack', 'wuauserv', 'UsoSvc') {
            Invoke-Tweak "Service off: $svc" {
              $s = Get-Service -Name $svc -ErrorAction Stop
              if ($s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') { return 'already off' }
              Set-Service -Name $svc -StartupType Disabled
              if ($s.Status -ne 'Stopped') { Stop-Service -Name $svc -Force -ErrorAction Stop; $s.WaitForStatus('Stopped', '00:00:20') }
            }
          }

          # Extra useless services identified from Process Explorer screenshots.
          # None of these are needed during a Cloud PC / RDP session.
          # WaAppAgent + WindowsAzureGuestAgent: Azure VM guest agents (runner handles this itself via hosted-compute-agent)
          # MSDTC: Distributed Transaction Coordinator — no apps here use it
          # SQLWriter: SQL Server VSS Writer — no SQL Server here
          # sshd: OpenSSH server — Tailscale + RDP is the access path, not SSH
          # MSMQ / mqsvc: Message Queuing — unused
          # vmms: Hyper-V Virtual Machine Management — no nested VMs needed
          # spooler: Print Spooler — no printing
          # tiledatamodelsvc / TiWorker: Windows Update tile cache / update worker
          foreach ($svc in 'WindowsAzureGuestAgent','MSDTC','SQLWriter','sshd','MSMQ','vmms','Spooler') {
            Invoke-Tweak "Service off: $svc" {
              $s = Get-Service -Name $svc -ErrorAction Stop
              if ($s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') { return 'already off' }
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              if ($s.Status -ne 'Stopped') { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue; try { $s.WaitForStatus('Stopped', '00:00:15') } catch {} }
              'stopped'
            }
          }

          # Kill TiWorker — stop TrustedInstaller first so it can't respawn it
          Invoke-Tweak 'Kill TiWorker.exe (Windows Update worker)' {
            Stop-Service -Name TrustedInstaller -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            foreach ($name in 'TiWorker','TrustedInstaller') {
              foreach ($p in (Get-Process -Name $name -ErrorAction SilentlyContinue)) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              }
            }
            if (Get-Process -Name TiWorker -ErrorAction SilentlyContinue) { 'still running' } else { 'gone' }
          }

          # Additional services still visible in Process Explorer after the initial tweaks.
          # docker: Docker daemon — not needed on a Cloud PC / RDP session
          # WslService: WSL — not needed
          # vmcompute: Hyper-V host compute service (different from vmms which is VM Management)
          # SecurityHealthService: Windows Security health dashboard — Defender is already suspended
          foreach ($svc in 'docker','WslService','vmcompute','SecurityHealthService') {
            Invoke-Tweak "Service off: $svc" {
              $s = Get-Service -Name $svc -ErrorAction Stop
              if ($s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') { return 'already off' }
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
              if ($s.Status -ne 'Stopped') { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue; try { $s.WaitForStatus('Stopped', '00:00:15') } catch {} }
              'stopped'
            }
          }

          # Direct process kills for processes that linger after their service is stopped.
          # WaAppAgent.exe: Azure guest agent worker (service stopped above but process can outlive it)
          # dockerd.exe: Docker daemon process
          # wslservice.exe: WSL service process
          Invoke-Tweak 'Kill lingering agent/daemon processes' {
            $targets = 'WaAppAgent','dockerd','wslservice','vmcompute'
            $killed = @()
            foreach ($name in $targets) {
              foreach ($p in (Get-Process -Name $name -ErrorAction SilentlyContinue)) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                $killed += $name
              }
            }
            if ($killed.Count -gt 0) { "killed: $($killed -join ', ')" } else { 'none running' }
          }

          $failed = @($results | Where-Object { $_ -like '*| FAILED |*' }).Count
          Write-Host "Performance tweaks finished: $($results.Count - $failed) applied, $failed failed. Failures do not stop the job."
          $summary = "### Performance tweaks`n`n| Tweak | Result | Detail |`n|---|---|---|`n" + ($results -join "`n") + "`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # Native commands above can leave a non-zero exit code behind; the tweaks are best effort, so the step itself must not report it.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Restore saved state
        continue-on-error: true
        shell: pwsh
        run: ./scripts/restore-state.ps1

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'tailscale.msi'
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
          $p = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Tailscale MSI exited with code $($p.ExitCode)." }
          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) { throw 'tailscale.exe not found after install.' }

      - name: Join tailnet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          for ($i = 0; $i -lt 30 -and (Get-Service -Name Tailscale -ErrorAction SilentlyContinue).Status -ne 'Running'; $i++) { Start-Sleep -Seconds 2 }
          if ((Get-Service -Name Tailscale).Status -ne 'Running') { throw 'Tailscale service is not running.' }
          & $ts up --auth-key="$env:TS_AUTHKEY" --hostname="cloudpc-$env:GITHUB_RUN_NUMBER" --unattended --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed with exit code $LASTEXITCODE." }
          $ip = ''
          for ($i = 0; $i -lt 30 -and [string]::IsNullOrWhiteSpace($ip); $i++) {
            $ip = ((& $ts ip -4) | Select-Object -First 1)
            if ([string]::IsNullOrWhiteSpace($ip)) { Start-Sleep -Seconds 2 }
          }
          if ([string]::IsNullOrWhiteSpace($ip)) { throw 'No Tailscale IPv4 address was assigned.' }
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP is reachable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $r.TcpTestSucceeded) { throw "TCP 3389 on $env:TAILSCALE_IP is not reachable." }
          Write-Host "RDP ready on $env:TAILSCALE_IP (Tailscale name: cloudpc-$env:GITHUB_RUN_NUMBER, user: $env:RDP_USERNAME, password: your RDP_PASSWORD secret)"
          "### Cloud PC ready`n`nTailscale name: ``cloudpc-$env:GITHUB_RUN_NUMBER``  IP: ``$env:TAILSCALE_IP``  user: ``$env:RDP_USERNAME``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Download Roblox Studio installer to the desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\Users\Public\Desktop\RobloxStudioInstaller.exe'
          Invoke-WebRequest -Uri $env:STUDIO_INSTALLER_URL -OutFile $dest
          $f = Get-Item $dest
          $head = [System.IO.File]::ReadAllBytes($dest)[0..1]
          if ($f.Length -lt 100KB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) { Remove-Item $dest -Force; throw "Downloaded file is not a valid Windows executable ($($f.Length) bytes)." }
          Write-Host "Installer saved to $dest ($($f.Length) bytes)"

      - name: Download and install Roblox Player
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # Resolves the current live WindowsPlayer build from Roblox's own client-version API, then builds the
          # matching bootstrapper URL. Not run by me on this runner, but the URL pattern and the API's response
          # shape are cross-confirmed from Roblox's own API docs (create.roblox.com), the pizzaboxer/bloxstrap
          # wiki's write-up of the bootstrapper's internals, and several independent third-party sandbox traces
          # of real RobloxPlayerLauncher.exe downloads: https://setup.rbxcdn.com/<clientVersionUpload>-RobloxPlayerLauncher.exe
          # clientVersionUpload already includes the "version-" prefix (e.g. "version-460909c4fe904aae"); the
          # previous static guess (bare RobloxPlayerLauncher.exe with no version) was never confirmed to resolve
          # to anything and no evidence of it existing turned up, so it is replaced rather than kept as a fallback.
          $versionInfo = Invoke-RestMethod -Uri 'https://clientsettings.roblox.com/v2/client-version/WindowsPlayer/channel/LIVE'
          $versionHash = $versionInfo.clientVersionUpload
          if ([string]::IsNullOrWhiteSpace($versionHash)) { throw 'clientsettings.roblox.com did not return clientVersionUpload.' }
          Write-Host "Live WindowsPlayer version: $versionHash"

          $installerUrl = "https://setup.rbxcdn.com/$versionHash-RobloxPlayerLauncher.exe"
          $installerPath = 'C:\Users\Public\Desktop\RobloxPlayerLauncher.exe'
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $f = Get-Item $installerPath
          $head = [System.IO.File]::ReadAllBytes($installerPath)[0..1]
          if ($f.Length -lt 100KB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) { Remove-Item $installerPath -Force; throw "Downloaded file is not a valid Windows executable ($($f.Length) bytes)." }
          Write-Host "Installer saved to $installerPath ($($f.Length) bytes)"

          # No silent-install flag is passed. RobloxPlayerLauncher.exe is the bootstrapper itself, not a
          # traditional NSIS/InstallShield wizard; per the bloxstrap wiki write-up it runs its own download-
          # and-extract sequence on an automatic progress dialog with nothing to click through, then tries to
          # launch Roblox if it was given a join link. Unverified on this runner: if it is NOT given a join
          # link, what it does at that last step (exit quietly, or show an error dialog) is unknown to me, and
          # that dialog, if it appears, would need dismissing by hand over RDP; this step only confirms install.
          $p = Start-Process -FilePath $installerPath -PassThru
          $exited = $p.WaitForExit(300000)
          if (-not $exited) { Write-Host 'Bootstrapper did not finish within 5 minutes; it may still be running or showing a dialog. Check over RDP.' }

          $betaExe = Get-ChildItem -Path "$env:LOCALAPPDATA\Roblox\Versions\$versionHash" -Filter RobloxPlayerBeta.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($betaExe) { Write-Host "Installed: $($betaExe.FullName)" }
          else { Write-Host "RobloxPlayerBeta.exe not found yet under `$env:LOCALAPPDATA\Roblox\Versions\$versionHash; if the bootstrapper is still running or waiting on a dialog, finish it over RDP, then re-run Roblox Diagnose." }

      - name: Add Roblox Diagnose shortcut to the desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolsDir = 'C:\ProgramData\CloudPC'
          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null
          $scriptPath = Join-Path $toolsDir 'roblox-diagnose.ps1'
          # Run from inside the RDP session, after installing Roblox Player, when a game will not open.
          # Finds whatever RobloxPlayerBeta.exe is actually installed (the folder name is a per-install version hash, so it is never hardcoded), launches it,
          # waits up to 20 seconds, then writes GPU info, OS build, the process exit code (if it already exited), recent Windows Application-log errors and
          # the newest Roblox log to roblox-diagnose.txt on the desktop and opens it. It does not interpret the result; you read the file and tell me what it says.
          $lines = @(
            '$ErrorActionPreference = ''Continue''',
            '$out = Join-Path ([Environment]::GetFolderPath(''Desktop'')) ''roblox-diagnose.txt''',
            '$report = [System.Collections.Generic.List[string]]::new()',
            '$report.Add("Roblox Diagnose - $(Get-Date -Format u)")',
            '$report.Add("")',
            '$report.Add("--- GPU (Win32_VideoController) ---")',
            'Get-CimInstance Win32_VideoController | ForEach-Object { $report.Add("$($_.Name) | driver $($_.DriverVersion) | $($_.AdapterRAM) bytes VRAM") }',
            '$report.Add("")',
            '$report.Add("--- OS ---")',
            '$os = Get-CimInstance Win32_OperatingSystem',
            '$report.Add("$($os.Caption) build $($os.BuildNumber)")',
            '$report.Add("")',
            '$exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Roblox\Versions" -Filter RobloxPlayerBeta.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1',
            'if (-not $exe) {',
            '  $report.Add("RobloxPlayerBeta.exe not found under $env:LOCALAPPDATA\Roblox\Versions - Player is not installed yet.")',
            '} else {',
            '  $report.Add("--- Launch ---")',
            '  $report.Add("Starting $($exe.FullName)")',
            '  $p = Start-Process -FilePath $exe.FullName -PassThru',
            '  $exited = $p.WaitForExit(20000)',
            '  if ($exited) { $report.Add("Process exited within 20s, exit code $($p.ExitCode).") }',
            '  else { $report.Add("Process is still running after 20s (exit code not available yet); check the window on screen too.") }',
            '  $report.Add("")',
            '  $report.Add("--- Recent Windows Application-log errors (last 5 min) ---")',
            '  $since = (Get-Date).AddMinutes(-5)',
            '  try {',
            '    Get-WinEvent -FilterHashtable @{LogName=''Application''; Level=2; StartTime=$since} -MaxEvents 20 -ErrorAction Stop |',
            '      ForEach-Object { $report.Add("$($_.TimeCreated.ToString(''u'')) [$($_.ProviderName)] $($_.Message -replace ''\r?\n'', '' '')") }',
            '  } catch { $report.Add("(no matching events, or Get-WinEvent failed: $_)") }',
            '}',
            '$report.Add("")',
            '$report.Add("--- Newest Roblox log ---")',
            '$logDir = "$env:LOCALAPPDATA\Roblox\logs"',
            'if (Test-Path $logDir) {',
            '  $latest = Get-ChildItem $logDir -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1',
            '  if ($latest) { $report.Add("File: $($latest.Name)"); $report.Add((Get-Content $latest.FullName -Raw)) }',
            '  else { $report.Add("Logs folder exists but is empty.") }',
            '} else { $report.Add("No $logDir yet.") }',
            'Set-Content -Path $out -Value ($report -join "`r`n") -Encoding utf8',
            'Start-Process notepad.exe $out'
          )
          Set-Content -Path $scriptPath -Value ($lines -join "`r`n") -Encoding utf8
          $lnk = 'C:\Users\Public\Desktop\Roblox Diagnose.lnk'
          $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          $sh.TargetPath = 'powershell.exe'
          $sh.Arguments = "-NoLogo -ExecutionPolicy Bypass -File `"$scriptPath`""
          $sh.WorkingDirectory = $toolsDir
          $sh.Save()
          if (-not (Test-Path $lnk)) { throw 'Shortcut was not created.' }
          Write-Host "Roblox Diagnose shortcut created: $lnk"

      - name: Add Claude Desktop download shortcut to the desktop
        continue-on-error: true
